<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Asistente Nuestro Parche</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#273A70">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asistente NP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#273A70; --navy-deep:#1b2a54; --gold:#FFC500; --gold-deep:#F0B400;
    --white:#fff; --ink:#141b33; --muted:#8a92a6; --bg:#0d1730;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; overflow-x:hidden;
  }

  /* ====================== VISTA MENÚ ====================== */
  #menu{
    min-height:100vh;
    display:flex; flex-direction:column;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(255,197,0,.16), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(255,197,0,.10), transparent 55%),
      linear-gradient(160deg,#1b2a54 0%, #0d1730 100%);
    padding:
      max(28px, env(safe-area-inset-top)) 20px
      max(28px, env(safe-area-inset-bottom)) 20px;
  }
  .brandbar{
    display:flex; align-items:center; gap:16px; justify-content:center;
    margin:14px 0 6px; text-align:center;
  }
  .brandbar img{ height:64px; width:64px; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .brandbar .txt .k{
    font-family:'Merriweather',serif; font-weight:900; color:#fff;
    font-size:clamp(22px,5vw,34px); line-height:1.05; letter-spacing:-.01em;
  }
  .brandbar .txt .k .hl{ color:var(--gold); }
  .brandbar .txt .t{
    color:var(--gold); font-size:11px; font-weight:800; letter-spacing:.22em;
    text-transform:uppercase; margin-top:6px;
  }
  .lead{
    text-align:center; color:rgba(255,255,255,.72); font-size:14.5px;
    max-width:560px; margin:12px auto 26px; line-height:1.55;
  }

  .grid{
    width:100%; max-width:1000px; margin:0 auto;
    display:grid; gap:16px;
    grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
  }
  .card{
    position:relative; text-align:left; cursor:pointer;
    border:none; border-radius:20px; padding:22px 20px 20px;
    background:linear-gradient(180deg,#fff,#f6f7fb);
    color:var(--ink); font-family:inherit;
    box-shadow:0 10px 30px rgba(0,0,0,.28);
    transition:transform .12s ease, box-shadow .12s ease;
    overflow:hidden;
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 16px 40px rgba(0,0,0,.36); }
  .card:active{ transform:translateY(0); }
  .card .stripe{ position:absolute; top:0; left:0; right:0; height:6px; }
  .card .emoji{
    width:56px; height:56px; border-radius:15px;
    display:flex; align-items:center; justify-content:center; font-size:28px;
    margin-bottom:14px; box-shadow:0 6px 16px rgba(0,0,0,.12);
  }
  .card h2{ font-family:'Merriweather',serif; font-weight:900; font-size:19px; margin:0 0 6px; color:var(--navy-deep); }
  .card p{ margin:0 0 14px; font-size:13px; color:#5a6178; line-height:1.5; }
  .card .go{
    display:inline-flex; align-items:center; gap:7px;
    font-size:13px; font-weight:800; color:var(--navy);
  }
  .card .go .arr{ transition:transform .12s ease; }
  .card:hover .go .arr{ transform:translateX(4px); }

  .footnote{ text-align:center; color:rgba(255,255,255,.5); font-size:12px; margin:30px auto 4px; max-width:560px; line-height:1.5; }
  .footnote a{ color:var(--gold); text-decoration:none; }

  #installBtn{
    display:none; margin:22px auto 0; cursor:pointer;
    background:var(--gold); color:var(--navy-deep); border:none;
    border-radius:999px; padding:13px 26px; font-weight:800; font-size:14px;
    font-family:inherit; box-shadow:0 8px 22px rgba(255,197,0,.3);
    align-items:center; gap:9px;
  }
  #installBtn:hover{ background:var(--gold-deep); }

  /* ====================== VISTA MÓDULO ====================== */
  #viewer{ display:none; position:fixed; inset:0; flex-direction:column; background:#fff; z-index:100; }
  .topbar{
    flex:0 0 auto; display:flex; align-items:center; gap:12px;
    background:var(--navy); color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px 10px;
  }
  .backbtn{
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    background:rgba(255,255,255,.12); color:#fff; border:none;
    border-radius:10px; padding:9px 14px; font-size:14px; font-weight:700;
    font-family:inherit;
  }
  .backbtn:hover{ background:rgba(255,255,255,.22); }
  .topbar .modtitle{ font-weight:800; font-size:15px; letter-spacing:.01em; display:flex; align-items:center; gap:9px; }
  .topbar .modtitle .dot{ width:10px; height:10px; border-radius:50%; }
  .frame-wrap{ flex:1 1 auto; position:relative; background:#0d1730; }
  #moduleFrame{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  .frame-loading{
    position:absolute; inset:0; display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; color:#fff; background:#0d1730;
  }
  .spin{ width:38px; height:38px; border-radius:50%; border:4px solid rgba(255,255,255,.2); border-top-color:var(--gold); animation:sp 1s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

  <!-- ==================== MENÚ ==================== -->
  <main id="menu">
    <div class="brandbar">
      <img src="icon-192.png" alt="Nuestro Parche">
      <div class="txt">
        <div class="k">Asistente <span class="hl">Nuestro Parche</span></div>
        <div class="t">Centro de creación de contenido</div>
      </div>
    </div>
    <p class="lead">Todas tus herramientas de diseño en un solo lugar. Elige qué quieres crear hoy.</p>

    <div class="grid" id="grid"></div>

    <button id="installBtn">⬇ Instalar la app en este dispositivo</button>

    <p class="footnote">
      Nuestro Parche · Medio de Comunicación Digital<br>
      Los módulos de imagen necesitan conexión a internet la primera vez.
    </p>
  </main>

  <!-- ==================== VISOR DE MÓDULO ==================== -->
  <section id="viewer">
    <div class="topbar">
      <button class="backbtn" id="backBtn">‹ Menú</button>
      <div class="modtitle"><span class="dot" id="modDot"></span><span id="modName"></span></div>
    </div>
    <div class="frame-wrap">
      <div class="frame-loading" id="frameLoading"><div class="spin"></div><div>Abriendo módulo…</div></div>
      <iframe id="moduleFrame" title="Módulo" allow="fullscreen; autoplay; clipboard-write; encrypted-media"
              allowfullscreen referrerpolicy="no-referrer"></iframe>
    </div>
  </section>

<script>
  var MODULES = [
    { id:'noticias',  file:'modulos/noticias.html',  emoji:'📰', color:'#FFC500', fg:'#1b2a54',
      title:'Noticias 1080×1350', desc:'Portada de noticia con foto, titular y categoría. Descarga la imagen lista para publicar.' },
    { id:'carrusel',  file:'modulos/carrusel.html',  emoji:'🎠', color:'#273A70', fg:'#ffffff',
      title:'Carruseles', desc:'Diapositivas 1080×1350 (4:5). Diseña una, descárgala y repite para la siguiente.' },
    { id:'portadas',  file:'modulos/portadas.html',  emoji:'🖼️', color:'#A8326B', fg:'#ffffff',
      title:'Portadas IG / TikTok', desc:'Portada con foto de fondo y titular grande. Formatos 1080×1920 y 1080×1350.' },
    { id:'videos',    file:'modulos/videos.html',    emoji:'🎬', color:'#E8790C', fg:'#ffffff',
      title:'Videos', desc:'Marco de marca 1080×1920 (9:16). Descarga la portada en PNG o el video final en MP4.' },
    { id:'videonews', file:'modulos/video-news.html', emoji:'🎥', color:'#1FA34D', fg:'#ffffff',
      title:'Video News', desc:'Convierte una noticia (enlace, texto o audio) en un video vertical listo para redes.' }
  ];

  var $ = function(id){ return document.getElementById(id); };
  var byId = {};
  MODULES.forEach(function(m){ byId[m.id] = m; });

  // ---- Construir el menú ----
  (function build(){
    var grid = $('grid');
    MODULES.forEach(function(m){
      var card = document.createElement('button');
      card.className = 'card';
      card.setAttribute('data-id', m.id);
      card.innerHTML =
        '<div class="stripe" style="background:'+m.color+'"></div>' +
        '<div class="emoji" style="background:'+m.color+';color:'+m.fg+'">'+m.emoji+'</div>' +
        '<h2>'+m.title+'</h2>' +
        '<p>'+m.desc+'</p>' +
        '<span class="go">Abrir módulo <span class="arr">→</span></span>';
      card.addEventListener('click', function(){ location.hash = m.id; });
      grid.appendChild(card);
    });
  })();

  // ---- Router por hash (permite usar el botón "atrás") ----
  function openModule(m){
    $('modName').textContent = m.title;
    $('modDot').style.background = m.color;
    $('frameLoading').style.display = 'flex';
    var f = $('moduleFrame');
    f.onload = function(){ $('frameLoading').style.display = 'none'; };
    f.src = m.file;
    $('viewer').style.display = 'flex';
    $('menu').style.display = 'none';
    document.querySelector('meta[name=theme-color]').setAttribute('content', m.color);
  }
  function showMenu(){
    $('viewer').style.display = 'none';
    $('menu').style.display = 'flex';
    var f = $('moduleFrame');
    // liberar memoria del módulo anterior
    f.onload = null; f.src = 'about:blank';
    document.querySelector('meta[name=theme-color]').setAttribute('content', '#273A70');
  }
  function route(){
    var id = (location.hash || '').replace('#','');
    if(id && byId[id]){ openModule(byId[id]); }
    else { showMenu(); }
  }
  window.addEventListener('hashchange', route);
  $('backBtn').addEventListener('click', function(){
    if(location.hash){ history.back(); } else { showMenu(); }
  });
  route();

  // ---- Instalación PWA ----
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferredPrompt = e;
    $('installBtn').style.display = 'inline-flex';
  });
  $('installBtn').addEventListener('click', function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function(){
      deferredPrompt = null; $('installBtn').style.display = 'none';
    });
  });
  window.addEventListener('appinstalled', function(){ $('installBtn').style.display = 'none'; });

  // ---- Registrar service worker (solo bajo http/https) ----
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
