<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#273A70" />
<title>Nuestro Parche · Video News</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#FFC500; --navy:#273A70; --navy-deep:#1B2A54; --ink:#12193A;
    --paper:#F5F6FA; --line:#e3e6ef; --muted:#6b7291; --ok:#2e9e6b; --warn:#c9861c; --danger:#d64545;
    --radius:16px; --shadow:0 6px 24px rgba(19,25,58,.12);
    --font-body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --font-title:'Merriweather',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font-body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  a{color:var(--navy)}
  .app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  /* Header */
  .top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;
       padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top))}
  .top img{height:34px}
  .top .t{font-weight:800;font-size:15px;letter-spacing:.2px}
  .top .t small{display:block;font-weight:500;font-size:11px;color:#c7cff0}
  .top .back{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;font-weight:700;
             padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;display:none}
  .top .back.show{display:inline-block}

  main{flex:1;padding:20px 18px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  h1{font-family:var(--font-title);font-weight:900;font-size:26px;margin:6px 0 4px}
  .lead{color:var(--muted);margin:0 0 22px;font-size:15px}
  h2{font-family:var(--font-title);font-weight:900;font-size:20px;margin:0 0 12px}

  /* Home source cards */
  .sources{display:grid;gap:14px}
  .src{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
       padding:20px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
  .src:hover{transform:translateY(-2px);border-color:var(--navy)}
  .src .ico{width:56px;height:56px;flex:none;border-radius:14px;background:var(--navy);color:var(--gold);
            display:grid;place-items:center;font-size:26px}
  .src .txt b{display:block;font-size:17px;font-weight:800;color:var(--ink)}
  .src .txt span{font-size:13.5px;color:var(--muted)}

  /* Forms */
  .field{margin:0 0 16px}
  label.lb{display:block;font-weight:700;font-size:13px;margin:0 0 6px}
  input[type=text],input[type=url],textarea,select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);
     border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(39,58,112,.12)}
  textarea{min-height:150px;resize:vertical;line-height:1.55}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px}

  /* Buttons */
  .btn{appearance:none;border:0;border-radius:12px;font-family:inherit;font-weight:800;font-size:15px;
       padding:14px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
  .btn.primary{background:var(--navy);color:#fff}
  .btn.gold{background:var(--gold);color:var(--ink)}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
  .btn.sm{padding:9px 12px;font-size:13px;border-radius:10px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.block{width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row.end{justify-content:flex-end}

  /* Segmented (con voz / sin voz) */
  .seg{display:inline-flex;background:#eef0f7;border-radius:12px;padding:4px;gap:4px}
  .seg button{border:0;background:transparent;font-family:inherit;font-weight:700;font-size:14px;color:var(--muted);
              padding:10px 16px;border-radius:9px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(19,25,58,.12)}

  /* Cards / review */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 16px;box-shadow:var(--shadow)}
  .kv{display:flex;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:0}
  .kv b{min-width:120px;color:var(--muted);font-weight:700}
  .chip{display:inline-block;background:var(--navy);color:#fff;font-weight:800;font-size:12px;padding:5px 11px;border-radius:20px}
  .chip.gold{background:var(--gold);color:var(--ink)}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .tag{background:#eef0f7;color:var(--navy);font-weight:600;font-size:12.5px;padding:5px 10px;border-radius:8px}
  .warn{background:#fff8e8;border:1px solid #f2d999;color:#7a5a12;border-radius:12px;padding:12px 14px;font-size:13.5px;margin:0 0 10px;display:flex;gap:10px}
  .warn b{color:#a9781a}

  /* Scene list */
  .scene{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
  .scene .sh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .scene .sh .n{width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
  .scene .sh .role{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .scene .sh .dur{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
  .scene textarea{min-height:64px}
  .scene .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

  /* Preview */
  .stage{display:flex;justify-content:center;background:#0c1330;border-radius:16px;padding:14px;margin-bottom:14px}
  #stage-canvas{width:auto;height:min(64vh,560px);max-width:100%;border-radius:10px;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .transport{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:14px}

  /* Progress */
  .bar{height:10px;background:#e6e9f3;border-radius:6px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:var(--gold);transition:width .15s}

  /* Thumbs */
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .thumbs img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .thumbs .empty{font-size:13px;color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
         padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1}
  .spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .center-load{display:flex;flex-direction:column;align-items:center;gap:14px;padding:50px 0;color:var(--muted)}
  .center-load .spin{border-color:rgba(39,58,112,.25);border-top-color:var(--navy);width:34px;height:34px}
  .install{background:#fff;border:1px dashed var(--navy);border-radius:12px;padding:12px 14px;font-size:13px;margin-top:18px;display:none;gap:10px;align-items:center}
  .install.show{display:flex}
  .muted{color:var(--muted)} .mt{margin-top:14px} .mb0{margin-bottom:0}
</style>
</head>
<body>
  <div class="app">
    <header class="top">
      <img id="brand-logo" alt="Nuestro Parche" />
      <div class="t">Video News<small>Nuestro Parche · producción audiovisual</small></div>
      <button class="back" id="back-btn">‹ Volver</button>
    </header>
    <main id="screen"><!-- las pantallas se renderizan aquí --></main>
  </div>

  <canvas id="stage-canvas" width="1080" height="1920" style="display:none"></canvas>
  <div class="toast" id="toast"></div>

  <script>
/* === js/article.js === */
/* =============================================================================
 * MÓDULO ARTICLE — obtiene y normaliza la información de la fuente
 * -----------------------------------------------------------------------------
 * Tres orígenes (sección 1): URL de nuestroparche.com, TEXTO pegado, AUDIO
 * (transcripción). Todos terminan en un mismo objeto "article" normalizado.
 * ===========================================================================*/
window.NPArticle = (function () {
  const CFG = window.NP_CONFIG;

  /* ---- utilidades de texto -------------------------------------------- */
  function stripHtml(html) {
    const d = document.createElement("div");
    d.innerHTML = html || "";
    d.querySelectorAll("script,style,figure,figcaption,iframe,.wp-block-embed,.sharedaddy,.jp-relatedposts,.code-block,.adsbygoogle").forEach(n => n.remove());
    // Extraer por bloques para conservar límites de párrafo (mejores frases).
    const blocks = [];
    d.querySelectorAll("p,li,h1,h2,h3,h4,blockquote").forEach(el => { const t = el.textContent.replace(/\s+/g, " ").trim(); if (t) blocks.push(t); });
    if (blocks.length) return blocks.join("\n").trim();
    return (d.textContent || "").replace(/[ \t]+/g, " ").trim();
  }

  function decodeEntities(s) {
    const t = document.createElement("textarea");
    t.innerHTML = s || "";
    return t.value;
  }

  // Extrae imágenes con su pie de foto desde el HTML del cuerpo.
  function extractImages(html) {
    const out = [];
    const d = document.createElement("div");
    d.innerHTML = html || "";
    d.querySelectorAll("figure, .wp-block-image").forEach(fig => {
      const img = fig.querySelector("img");
      const cap = fig.querySelector("figcaption");
      if (img && img.src) out.push({ url: absolutize(img.getAttribute("src") || img.src), caption: cap ? cap.textContent.trim() : "" });
    });
    // imágenes sueltas
    d.querySelectorAll("img").forEach(img => {
      const src = absolutize(img.getAttribute("src") || img.src);
      if (src && !out.some(o => o.url === src)) out.push({ url: src, caption: img.getAttribute("alt") || "" });
    });
    return out;
  }

  function absolutize(u) {
    if (!u) return u;
    try { return new URL(u, CFG.app.site).href; } catch (e) { return u; }
  }

  // Adivina la sección a partir de los IDs de categoría del post de WP.
  function sectionFromCategoryIds(ids) {
    for (const slug in CFG.sections) {
      if (ids && ids.includes(CFG.sections[slug].id)) return slug;
    }
    return null;
  }

  /* ---- fetch con respaldo anti-CORS ----------------------------------- */
  async function fetchJson(url) {
    // 1) intento directo
    try {
      const r = await fetch(url, { headers: { "Accept": "application/json" } });
      if (r.ok) return await r.json();
    } catch (e) { /* cae al proxy */ }
    // 2) respaldo vía proxy CORS público (solo lectura de contenido público)
    try {
      const prox = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
      const r = await fetch(prox);
      if (r.ok) return await r.json();
    } catch (e) { /* nada */ }
    throw new Error("No se pudo leer la noticia (posible bloqueo de red/CORS). Abre la app publicada, o usa 'Desde un texto' pegando el contenido.");
  }

  function slugFromUrl(u) {
    try {
      const url = new URL(u.trim());
      const parts = url.pathname.split("/").filter(Boolean);
      return parts.length ? decodeURIComponent(parts[parts.length - 1]) : "";
    } catch (e) { return ""; }
  }

  /* ---- ORIGEN A: URL de nuestroparche.com ----------------------------- */
  async function fromUrl(rawUrl) {
    const slug = slugFromUrl(rawUrl);
    if (!slug) throw new Error("La URL no parece válida.");
    let posts = await fetchJson(`${CFG.app.wpApi}/posts?slug=${encodeURIComponent(slug)}&_embed=1`);
    if (!Array.isArray(posts) || !posts.length) {
      // respaldo: búsqueda por texto
      posts = await fetchJson(`${CFG.app.wpApi}/posts?search=${encodeURIComponent(slug.replace(/-/g, " "))}&per_page=1&_embed=1`);
    }
    if (!Array.isArray(posts) || !posts.length) throw new Error("No se encontró la noticia en nuestroparche.com. Verifica la URL o usa 'Desde un texto'.");
    return normalizeWpPost(posts[0], rawUrl);
  }

  function normalizeWpPost(p, rawUrl) {
    const emb = p._embedded || {};
    const author = (emb.author && emb.author[0] && emb.author[0].name) || "";
    const sectionSlug = sectionFromCategoryIds(p.categories) || CFG.defaultSection;

    // imagen destacada
    const images = [];
    const fm = emb["wp:featuredmedia"] && emb["wp:featuredmedia"][0];
    if (fm && fm.source_url) images.push({ url: absolutize(fm.source_url), caption: decodeEntities(fm.caption && fm.caption.rendered ? stripHtml(fm.caption.rendered) : "") });
    // imágenes del cuerpo
    extractImages(p.content && p.content.rendered).forEach(im => { if (!images.some(o => o.url === im.url)) images.push(im); });

    return {
      sourceType: "url",
      sourceLabel: rawUrl,
      title: decodeEntities(stripHtml(p.title && p.title.rendered)) || "",
      subtitle: decodeEntities(stripHtml(p.excerpt && p.excerpt.rendered)) || "",
      body: decodeEntities(stripHtml(p.content && p.content.rendered)) || "",
      date: p.date ? p.date.slice(0, 10) : "",
      author,
      sectionSlug,
      link: p.link || rawUrl,
      images,
    };
  }

  /* ---- ORIGEN B: TEXTO pegado ----------------------------------------- */
  function fromText(text, opts) {
    opts = opts || {};
    const clean = (text || "").trim();
    if (!clean) throw new Error("Pega el texto de la noticia.");
    // Heurística: primera línea = título si es corta; primer párrafo = bajada.
    const lines = clean.split(/\n+/).map(s => s.trim()).filter(Boolean);
    let title = opts.title || "";
    let body = clean;
    if (!title && lines.length) {
      if (lines[0].length <= 120) { title = lines[0]; body = lines.slice(1).join("\n"); }
      else { title = lines[0].slice(0, 90); }
    }
    const paras = body.split(/\n+/).map(s => s.trim()).filter(Boolean);
    const subtitle = opts.subtitle || (paras[0] && paras[0].length < 220 ? paras[0] : "");
    return {
      sourceType: "text",
      sourceLabel: "Texto pegado",
      title, subtitle,
      body: body.trim(),
      date: new Date().toISOString().slice(0, 10),
      author: opts.author || "",
      sectionSlug: opts.sectionSlug || CFG.defaultSection,
      link: "",
      images: [],
    };
  }

  /* ---- ORIGEN C: AUDIO (transcripción ya editada) --------------------- */
  function fromTranscription(text, opts) {
    const a = fromText(text, opts);
    a.sourceType = "audio";
    a.sourceLabel = opts && opts.fileName ? "Audio: " + opts.fileName : "Audio transcrito";
    return a;
  }

  return { fromUrl, fromText, fromTranscription, stripHtml, slugFromUrl };
})();

  <script>
/* === js/script-engine.js === */
/* =============================================================================
 * MÓDULO SCRIPT-ENGINE — genera el guion audiovisual SIN inventar (sección 4)
 * -----------------------------------------------------------------------------
 * EXTRACTIVO y coherente: usa frases COMPLETAS de la fuente, en el ORDEN de la
 * noticia, priorizando las que traen datos. No agrega hechos, cifras ni citas.
 * ===========================================================================*/
window.NPScript = (function () {
  const CFG = window.NP_CONFIG;
  const SOH = String.fromCharCode(1);
  let _coverage = { total: 0, included: 0 };   // ideas clave detectadas vs. incluidas

  /* ---- segmentación en oraciones COMPLETAS ---------------------------- */
  function sentences(text) {
    if (!text) return [];
    let m = text.replace(/\s*\n+\s*/g, SOH);                              // párrafos
    m = m.replace(/([.?!…])\s+(?=[«"“¿¡A-ZÁÉÍÓÚÑ0-9])/g, "$1" + SOH);     // fin de oración
    return m.split(SOH).map(s => s.trim()).filter(Boolean);
  }
  const WORD = s => (s.trim().match(/\S+/g) || []).length;

  /* ---- extracción de DATOS CLAVE (solo lo presente) ------------------- */
  const RE_MONEY  = /(\$\s?\d[\d.,]*\s?(mil|millones|millón|mil millones|billones)?|\b\d[\d.,]*\s?(pesos|cop|usd|dólares)\b)/gi;
  const RE_PCT    = /\b\d[\d.,]*\s?%|\b\d[\d.,]*\s?por\s?ciento\b/gi;
  const RE_NUM    = /\b\d{1,3}(?:[.,]\d{3})+(?:[.,]\d+)?\b|\b\d+(?:[.,]\d+)?\s?(mil|millones|millón|kilómetros|km|metros|hectáreas|personas|familias|viviendas|casos|días|horas|años|meses|toneladas|litros|barrios|cuadras|semanas)\b/gi;
  const RE_DATE   = /\b\d{1,2}\s?de\s?(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)(?:\s?de\s?\d{4})?\b|\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/gi;
  const RE_QUOTE  = /[«"“]([^»"”]{8,240})[»"”]/g;
  const RE_NAME   = /\b([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:[ ]+(?:de|del|la|las|los|y)?[ ]?[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+){1,3})\b/g;
  const RE_ANYNUM = /\b\d{1,3}(?:[.,]\d{3})+\b|\b\d{2,}(?:[.,]\d+)?\b/g;   // números "grandes" para fallback

  const HEDGE = /\b(presuntamente|al parecer|supuestamente|podría|podrían|habría|sería|se rumora|se especula|no confirmado|versiones|aparentemente|posiblemente)\b/i;
  const RE_PROMO = /nuestro parche (alcanza|es un medio|te invita|nació|naci[oó])|reproducciones|s[ií]guenos|suscr[ií]bete|d[eé]janos tu comentario|comparte esta|redes sociales|whats\s?app|\binstagram\b|\btiktok\b|\bfacebook\b|\btwitter\b|@[a-z0-9_]+|lee tambi[eé]n|te puede interesar|foto:|imagen:|©|derechos reservados|clic aqu[ií]/i;

  // Limpia promoción/boilerplate PERO conserva los saltos de párrafo (para
  // recorrer la noticia párrafo por párrafo y no perder ideas de más abajo).
  function cleanBody(text) {
    return (text || "").split(/\n+/)
      .map(par => sentences(par).filter(s => !RE_PROMO.test(s)).join(" ").trim())
      .filter(Boolean).join("\n");
  }

  // Menciona una norma (ley, decreto…) o un nombre propio de 2+ palabras.
  const RE_LAW = /\b(ley|leyes|decreto|resoluci[oó]n|ordenanza|acuerdo|sentencia|art[ií]culo|c[oó]digo|proyecto de ley|pol[ií]tica p[uú]blica)\b/i;
  const RE_PROPER = /\b[A-ZÁÉÍÓÚÑ][a-záéíóúñ]{2,}\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]{2,}/;

  // Puntaje de "idea central" de una frase (más alto = más importante).
  function ideaScore(s, posInPar) {
    let sc = 0;
    if (RE_MONEY.test(s)) sc += 3; if (RE_PCT.test(s)) sc += 3;
    if (RE_NUM.test(s)) sc += 2; if (RE_DATE.test(s)) sc += 1;
    if (RE_LAW.test(s)) sc += 3;              // nombra una norma
    if (RE_PROPER.test(s)) sc += 2;           // nombra a alguien/algo propio
    if (/[«"“]/.test(s)) sc += 2;             // cita textual
    const w = WORD(s);
    if (w >= 8 && w <= 30) sc += 2; else if (w > 42) sc -= 1;
    sc += Math.max(0, 1.4 - (posInPar || 0) * 0.5);   // la 1ª frase del párrafo pesa algo más
    RE_MONEY.lastIndex = RE_PCT.lastIndex = RE_NUM.lastIndex = RE_DATE.lastIndex = 0;
    return sc;
  }

  // Idea central de UN párrafo: su mejor frase (y una 2ª si el párrafo es rico).
  function paragraphIdeas(par) {
    const sents = sentences(par).filter(isUsable);
    if (!sents.length) return [];
    const ranked = sents.map((s, i) => ({ s, i, sc: ideaScore(s, i) })).sort((a, b) => b.sc - a.sc);
    const out = [condense(ranked[0].s)];
    // 2ª idea solo si el párrafo es largo y trae otro dato fuerte distinto
    if (sents.length >= 3 && ranked[1] && ranked[1].sc >= 4) out.push(condense(ranked[1].s));
    return out;
  }

  // "Reescritura" ligera para redes: quita muletillas de arranque (sin inventar).
  function condense(s) {
    let t = (s || "").trim()
      .replace(/^\s*(sin embargo|no obstante|adem[aá]s|asimismo|as[ií] mismo|por su parte|por otro lado|de hecho|en ese sentido|entre tanto|mientras tanto|cabe (recordar|se[nñ]alar|mencionar|anotar) que|vale (la pena )?recordar que|es de anotar que)\s*,?\s*/i, "");
    if (t) t = t.charAt(0).toUpperCase() + t.slice(1);
    return t;
  }

  // Rótulo temático corto para la etiqueta amarilla (relacionado con el contenido,
  // en vez de "CLAVE 1/2…").
  const LABELS = { place: "EL LUGAR", money: "LA CIFRA", time: "LAS FECHAS", people: "LA COMUNIDAD", warning: "LA ALERTA", environment: "MEDIO AMBIENTE", water: "EL AGUA", transport: "MOVILIDAD", build: "LAS OBRAS", law: "LA NORMA", health: "SALUD", education: "EL ESTUDIO", gov: "LO OFICIAL", announce: "EL ANUNCIO", spark: "EN DETALLE" };
  function labelFor(text) {
    const n = (text || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    if (/\b(recomien|propone|piden|pide|solicit|sugiere|plantea|exige)\b/.test(n)) return "LA PROPUESTA";
    if (/denunci/.test(n)) return "LA DENUNCIA";
    if (/\b(investigador|estudio|universidad|informe|analisis|cientific)/.test(n)) return "EL ESTUDIO";
    if (/\b(advierte|alerta|riesgo|peligro|emergencia)\b/.test(n)) return "LA ALERTA";
    const icon = window.NPIcons ? NPIcons.match(text) : "spark";
    if (icon !== "spark" && LABELS[icon]) return LABELS[icon];
    // genérico con variedad (según el texto) para que no se repita la misma palabra
    const generic = ["EN DETALLE", "ADEMÁS", "TAMBIÉN", "LO CLAVE", "A TENER EN CUENTA"];
    let hsh = 0; for (let i = 0; i < n.length; i++) hsh = (hsh + n.charCodeAt(i)) % 997;
    return generic[hsh % generic.length];
  }

  function matchAll(re, text) {
    const out = []; let m; re.lastIndex = 0;
    while ((m = re.exec(text)) !== null) { out.push(m[1] || m[0]); if (m.index === re.lastIndex) re.lastIndex++; }
    return out;
  }
  const uniq = arr => [...new Set(arr.map(s => s.trim()).filter(Boolean))];
  const isYear = s => /^\d{4}$/.test(s.replace(/[.,]/g, "")) && +s.replace(/[.,]/g, "") >= 1900 && +s.replace(/[.,]/g, "") <= 2099;

  function extractData(text) {
    const money = uniq(matchAll(RE_MONEY, text));
    const pct   = uniq(matchAll(RE_PCT, text));
    const nums  = uniq(matchAll(RE_NUM, text));
    const dates = uniq(matchAll(RE_DATE, text));
    const quotes = uniq(matchAll(RE_QUOTE, text));
    const stop = new Set(["El","La","Los","Las","Un","Una","En","Con","Por","Para","Según","Este","Esta","Ese","Esa","Y","O","A","De","Del","Al","Se","Su","Sus","Como","Pero","Ya","No","Sí","Hoy","Ayer","Mañana","Además","También","Cali","Colombia"]);
    const names = uniq(matchAll(RE_NAME, text)).filter(n => !stop.has(n.split(" ")[0]) || n.split(" ").length > 1).slice(0, 12);
    // Cifra "principal": dinero > % > número con unidad > cantidad con separador de
    // miles (ej. 20.000). NO se usan números "sueltos" (decretos, leyes, calles, años)
    // para no mostrar cifras engañosas como "EL DATO" (sección 4).
    const big = uniq(matchAll(RE_ANYNUM, text)).filter(n => /\d[.,]\d{3}/.test(n) && !isYear(n));
    const headline = money[0] || pct[0] || nums[0] || big[0] || null;
    const figures = uniq([money[0], pct[0], ...nums, ...big].filter(Boolean));   // para rotar en "dato"
    return { money, pct, nums, dates, quotes, names, headline, figures, all: uniq([...money, ...pct, ...nums, ...dates]) };
  }

  /* ---- ¿es una frase COMPLETA y útil (no un fragmento)? --------------- */
  function isUsable(s) {
    if (!s) return false;
    const w = WORD(s);
    if (w < 5) return false;                                   // fragmentos
    if (RE_PROMO.test(s)) return false;
    if (!/[a-záéíóúñ]/.test(s)) return false;                  // titulillos TODO MAYÚSCULAS
    if (/^[-•·*]/.test(s)) return false;
    return true;
  }
  function trimWords(s, max) {
    const w = s.trim().match(/\S+/g) || [];
    return w.length <= max ? s.trim() : w.slice(0, max).join(" ") + "…";
  }

  function recommendDuration(data, usable) {
    // Más contenido => más duración (20..60). Cada diapositiva dura ~2.6s.
    const facts = data.all.length + data.quotes.length + usable.length;
    let sec = facts <= 5 ? 30 : facts <= 10 ? 40 : facts <= 15 ? 50 : 60;
    return Math.min(CFG.duration.maxSec, Math.max(CFG.duration.minSec, sec));
  }

  /* ---- trozos CORTOS con la idea COMPLETA (subtítulos dinámicos) -------
   * Corta en comas/puntos y evita terminar en palabras "colgadas"
   * (preposiciones, artículos, conjunciones): esas pasan al trozo siguiente,
   * para que ninguna diapositiva quede con la idea a medias.               */
  const WEAK = new Set("de,del,la,el,los,las,un,una,unos,unas,y,e,o,u,que,a,al,con,en,por,para,sin,so,sobre,entre,hacia,desde,su,sus,mi,tu,lo,le,les,se,es,como,pero,porque,cuando,donde,si,ni,segun,según,tras,ante,más,mas,muy,ya,no".split(","));
  const bare = w => w.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^0-9a-zñ]/g, "");
  function phrases(text) {
    const clean = (text || "").replace(/^«|»$/g, "").replace(/\s+/g, " ").trim();
    if (!clean) return [];
    const maxW = CFG.duration.chunkWords, maxC = CFG.duration.chunkChars;
    const words = clean.split(" ");
    const out = []; let cur = [];
    const flush = () => {
      if (!cur.length) return;
      const carry = [];
      // no terminar en palabra débil: pásala(s) al comienzo del siguiente trozo
      while (cur.length > 1 && WEAK.has(bare(cur[cur.length - 1]))) carry.unshift(cur.pop());
      out.push(cur.join(" ").replace(/[ ,;:—–-]+$/, ""));
      cur = carry;
    };
    for (const w of words) {
      cur.push(w);
      if (/[.;:]$/.test(w)) flush();                              // corte fuerte
      else if (/,$/.test(w) && cur.length >= 3) flush();         // corte en coma
      else if (cur.length >= maxW || cur.join(" ").length >= maxC) flush();
    }
    if (cur.length) out.push(cur.join(" ").replace(/[ ,;:—–-]+$/, ""));
    while (out.length > 1 && out[out.length - 1].split(" ").length < 3) out[out.length - 2] += " " + out.pop();
    return out.filter(p => p && p.replace(/[^0-9A-Za-zÁÉÍÓÚÑáéíóúñ]/g, "").length > 1);
  }
  function firstFigure(s) { return matchAll(RE_MONEY, s)[0] || matchAll(RE_PCT, s)[0] || matchAll(RE_NUM, s)[0] || null; }
  function rotate(arr, k) { const n = arr.length; if (!n) return arr.slice(); const s = ((k % n) + n) % n; return arr.slice(s).concat(arr.slice(0, s)); }

  function buildWarnings(article, data, usable) {
    const w = [];
    if (HEDGE.test(article.body)) w.push("El texto contiene afirmaciones no confirmadas ('presuntamente', 'podría', etc.). Verifica antes de publicar.");
    if (!data.headline) w.push("No se detectaron cifras claras; el video se apoyará en texto e imágenes.");
    if (!article.images || !article.images.length) w.push("Esta noticia necesita recursos visuales adicionales. Carga fotos o videos.");
    if (usable.length < 2) w.push("El texto tiene poca información desarrollada; el guion será corto. Agrega más contexto en 'Editar'.");
    if (data.quotes.length && !article.author) w.push("Hay declaraciones citadas: confirma a quién se atribuyen antes de publicar.");
    if (_coverage.total > _coverage.included) w.push(`La noticia tiene ${_coverage.total} ideas clave y a esta duración caben ${_coverage.included}. Sube la duración (50-60s) para incluirlas todas.`);
    return w;
  }

  /* ---- construcción por DIAPOSITIVAS cortas -------------------------------
   * Estructura obligatoria: GANCHO → PUNTOS CLAVE (desarrollo) → CIERRE → CTA.
   * Cada diapositiva es un trozo corto (2-3 s). El nº de diapositivas se ajusta
   * a la duración pedida (para respetarla), con tope CFG.duration.maxSlides.
   * ---------------------------------------------------------------------- */
  function buildScenes(article, data, targetSec, seed) {
    seed = seed || 0;
    const D = CFG.duration;
    const section = CFG.sections[article.sectionSlug] || CFG.sections[CFG.defaultSection];
    const usable = sentences(article.body).filter(isUsable);

    // nº de diapositivas objetivo (una idea completa por diapositiva, ritmo cómodo).
    // (N — número de diapositivas — se calcula abajo, según cuántas ideas haya.)

    // Estructura adaptable: en videos MUY cortos (≤22s) se reduce lo fijo para
    // dejar más espacio al contenido.
    const shortMode = targetSec <= 22;

    // 1) GANCHO — el título (real).
    const hp = phrases(article.title);
    const half = Math.ceil(hp.length / 2);
    const hookSlides = [{ role: "gancho", kicker: section.kicker, title: article.title, text: hp.slice(0, half).join(" ") || article.title, layout: "hook" }];
    const hook2 = hp.slice(half).join(" ");
    if (!shortMode && hook2 && WORD(article.title) >= 10) hookSlides.push({ role: "gancho", kicker: section.kicker, title: article.title, text: hook2, layout: "hook" });

    // 4) CTA — conversión. Una sola en corto; dos si hay tiempo.
    const ctaSlides = shortMode
      ? [{ role: "cta", kicker: "SÍGUENOS", text: "Sigue a Nuestro Parche · nuestroparche.com", layout: "outro" }]
      : [
          { role: "cta", kicker: "SÍGUENOS", text: "Sigue a Nuestro Parche y comenta qué opinas", layout: "outro" },
          { role: "cta", kicker: "nuestroparche.com", text: "Lee la nota completa en nuestroparche.com", layout: "outro" },
        ];
    const includeCierre = !shortMode;   // el cierre se omite en videos muy cortos

    // 2) DESARROLLO — IDEA CENTRAL POR PÁRRAFO (cubre TODA la noticia, no solo el
    // arranque). Recorre cada párrafo, saca su mejor frase y la condensa.
    const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
    const seen = new Set();
    const paras = (article.body || "").split("\n").map(p => p.trim()).filter(Boolean);
    const ideasAll = [];   // {text, sc} en orden documental, deduplicado
    const firstBodyN = norm((sentences(paras[0] || "").filter(isUsable)[0]) || "");
    if (article.subtitle && WORD(article.subtitle) >= 6 && isUsable(article.subtitle) && !firstBodyN.startsWith(norm(article.subtitle).slice(0, 40))) {
      const k = norm(article.subtitle).slice(0, 50); if (k.length > 3) { seen.add(k); ideasAll.push({ text: condense(article.subtitle.trim()), sc: 5 }); }
    }
    paras.forEach(par => {
      for (const idea of paragraphIdeas(par)) {
        const k = norm(idea).slice(0, 50);
        if (k.length > 3 && !seen.has(k)) { seen.add(k); ideasAll.push({ text: idea, sc: ideaScore(idea, 0) }); }
      }
    });

    // nº de diapositivas: ritmo cómodo, pero SUBE si hay muchas ideas (para no
    // omitir información), sin bajar de slideMin por diapositiva.
    const fixed = hookSlides.length + ctaSlides.length + (includeCierre ? 1 : 0);
    const Nmax = Math.min(D.maxSlides, Math.floor(targetSec / D.slideMin));
    let N = Math.round(targetSec / D.ideaPaceSec);
    N = Math.min(Nmax, Math.max(N, Math.min(ideasAll.length + fixed, Nmax)));
    N = Math.max(N, 6);
    const devBudget = Math.max(3, N - fixed);

    // Si hay más ideas que espacio: conserva las MÁS IMPORTANTES de TODA la
    // noticia (leyes, nombres, cifras, citas), pero en el ORDEN del texto.
    let chosenIdx;
    if (ideasAll.length <= devBudget) chosenIdx = ideasAll.map((_, i) => i);
    else {
      const pick = new Set([0]);                              // siempre la apertura
      const pool = rotate(ideasAll.map((x, i) => ({ i, sc: x.sc })).filter(x => x.i !== 0).sort((a, b) => b.sc - a.sc), seed);
      for (const x of pool) { if (pick.size >= devBudget) break; pick.add(x.i); }
      chosenIdx = [...pick].sort((a, b) => a - b);
    }
    const devTexts = chosenIdx.map(i => ideasAll[i].text);

    const devSlides = [];
    let pIdx = 0;
    for (const idea of devTexts) {
      if (devSlides.length >= devBudget) break;
      pIdx++;
      for (const part of splitIdea(idea)) {           // 1-2 partes con la IDEA COMPLETA
        if (devSlides.length >= devBudget) break;
        const fig = firstFigure(part);
        devSlides.push(fig
          ? { role: "punto", kicker: labelFor(part), ideaN: pIdx, text: part, layout: "number", number: fig }
          : { role: "punto", kicker: labelFor(part), ideaN: pIdx, text: part, layout: "text" });
      }
    }
    if (data.quotes.length && devSlides.length < devBudget && !devTexts.some(t => t.indexOf(data.quotes[0].slice(0, 22)) >= 0)) {
      devSlides.push({ role: "punto", kicker: "EN SUS PALABRAS", text: "«" + trimWords(data.quotes[0], 16) + "»", layout: "quote", attribution: article.author || "" });
    }
    // Ideas realmente incluidas (por CLAVE), para avisar si quedó algo por fuera.
    _coverage = { total: ideasAll.length, included: new Set(devSlides.map(s => s.ideaN).filter(Boolean)).size };

    // Diapositivas DESTACADAS (~5 por minuto): número si hay cifra; si no, ÍCONO/vector.
    const featuredTarget = Math.max(2, Math.round(targetSec / 60 * D.featuredPerMinute));
    let featured = devSlides.filter(s => s.layout === "number").length;
    for (let i = 0; i < devSlides.length && featured < featuredTarget; i++) {
      const s = devSlides[i];
      if (s.layout === "text" && window.NPIcons) {
        s.layout = "icon"; s.icon = NPIcons.match(s.text); featured++;
        i++;   // deja una diapositiva de texto en medio (variar el ritmo)
      }
    }

    // 3) CIERRE — recap corto y contundente (base real). Se omite en videos muy cortos.
    const cierreBase = (ideasAll[0] && ideasAll[0].text) || article.title;
    const cierreSlides = includeCierre ? [{ role: "cierre", kicker: "EN CORTO", text: trimWords(cierreBase, 12), layout: "text" }] : [];

    // Ensamblar en ORDEN y recortar al nº de diapositivas objetivo.
    let slides = [...hookSlides, ...devSlides, ...cierreSlides, ...ctaSlides];
    if (slides.length > N) {
      const keepDev = Math.max(2, devSlides.length - (slides.length - N));
      slides = [...hookSlides, ...devSlides.slice(0, keepDev), ...cierreSlides, ...ctaSlides];
    }
    slides.forEach((s, i) => { s.image = i; s._rot = seed; });
    assignSlideDurations(slides, targetSec);
    slides.forEach(s => { s.subs = [{ text: s.text.replace(/^«|»$/g, ""), start: 0, end: s.durationSec }]; });
    return slides;
  }

  // Una IDEA completa por diapositiva; la parte en 2 solo si es muy larga.
  function splitIdea(sent) {
    const w = (sent.match(/\S+/g) || []).length;
    if (w <= CFG.duration.ideaMaxWords && sent.length <= CFG.duration.ideaMaxChars) return [sent.trim()];
    const parts = phrases(sent);
    if (parts.length <= 1) return [sent.trim()];
    const mid = Math.ceil(parts.length / 2);
    const a = parts.slice(0, mid).join(" "), b = parts.slice(mid).join(" ");
    return b ? [a, b] : [a];
  }

  // Reparte la duración por TIEMPO DE LECTURA (idea completa), clavando el total.
  function assignSlideDurations(slides, targetSec) {
    const D = CFG.duration, n = slides.length || 1;
    const base = slides.map(s => {
      const w = (s.text.match(/\S+/g) || []).length;
      let b = w / 2.7 + 0.7;                                         // ~tiempo de lectura
      if (s.layout === "number" || s.layout === "icon") b += 0.8;   // destacadas: un poco más
      if (s.role === "cta") b = 2.6;
      return Math.min(D.slideStretchMax, Math.max(D.slideMin, b));
    });
    const sum = base.reduce((a, b) => a + b, 0) || 1, scale = targetSec / sum;
    slides.forEach((s, i) => s.durationSec = Math.min(D.slideStretchMax, Math.max(D.slideMin, base[i] * scale)));
    // Cuadre fino para clavar la duración pedida.
    let diff = targetSec - slides.reduce((a, s) => a + s.durationSec, 0), guard = 0;
    while (Math.abs(diff) > 0.05 && guard++ < 300) {
      const step = diff / n; let applied = 0;
      for (const s of slides) { const nd = Math.min(D.slideStretchMax, Math.max(D.slideMin, s.durationSec + step)); applied += nd - s.durationSec; s.durationSec = nd; }
      diff -= applied; if (Math.abs(applied) < 1e-4) break;
    }
    slides.forEach(s => s.durationSec = Math.round(s.durationSec * 10) / 10);
  }

  function chunkSubtitles(text, durationSec) {
    const clean = (text || "").replace(/^«|»$/g, "").trim();
    const words = clean.match(/\S+/g) || [];
    const lines = []; let cur = [];
    for (const w of words) { cur.push(w); if (cur.join(" ").length >= 26 || cur.length >= 6) { lines.push(cur.join(" ")); cur = []; } }
    if (cur.length) lines.push(cur.join(" "));
    if (!lines.length) return [];
    const totalW = words.length || 1; let t = 0; const subs = [];
    for (const ln of lines) { const share = (WORD(ln) / totalW) * durationSec; subs.push({ text: ln, start: +t.toFixed(2), end: +(t + share).toFixed(2) }); t += share; }
    return subs;
  }

  /* ---- API pública ---------------------------------------------------- */
  function generate(article, opts) {
    opts = opts || {};
    const cleaned = Object.assign({}, article, { body: cleanBody(article.body) });
    const data = extractData(cleaned.body + "\n" + (cleaned.title || "") + "\n" + (cleaned.subtitle || ""));
    const usable = sentences(cleaned.body).filter(isUsable);
    const targetSec = opts.durationSec || recommendDuration(data, usable);
    const seed = opts.seed || 0;
    const scenes = buildScenes(cleaned, data, targetSec, seed);
    const narration = scenes.map(s => s.text.replace(/^«|»$/g, "")).join(" ");
    const totalSec = scenes.reduce((a, s) => a + s.durationSec, 0);
    return {
      article, seed,
      section: (CFG.sections[article.sectionSlug] || CFG.sections[CFG.defaultSection]),
      titleProposed: article.title,
      durationSec: Math.round(totalSec * 10) / 10,
      recommendedSec: targetSec,
      voice: opts.voice || "sin-voz",
      scenes, data, narration,
      warnings: buildWarnings(article, data, usable),
    };
  }

  // Regenera UNA escena de verdad: rota entre alternativas de la fuente (sección 16).
  // Devuelve true si cambió algo (para avisar al usuario).
  function regenerateScene(script, index) {
    const sc = script.scenes[index];
    if (!sc) return false;
    const usable = sentences(cleanBody(script.article.body)).filter(isUsable);
    const allChunks = []; usable.forEach(s => phrases(s).forEach(c => allChunks.push(c)));
    const others = new Set(script.scenes.filter((_, i) => i !== index).map(s => s.text.replace(/^«|»$/g, "")));
    sc._rot = (sc._rot || 0) + 1;
    let changed = false;

    if (sc.role === "cta") {
      const opts = ["Sigue a Nuestro Parche y comenta qué opinas", "Lee la nota completa en nuestroparche.com", "¿Qué opinas? Déjanos tu comentario", "Comparte esta noticia en Nuestro Parche"];
      const nt = opts[sc._rot % opts.length]; if (nt !== sc.text) { sc.text = nt; changed = true; }
    } else if (sc.layout === "quote") {
      const qs = script.data.quotes || [];
      if (qs.length > 1) { const nt = "«" + trimWords(qs[sc._rot % qs.length], 14) + "»"; if (nt !== sc.text) { sc.text = nt; changed = true; } }
    } else if (sc.layout === "hook") {
      const alt = usable.find(s => /\d/.test(s)) || usable[0];
      const cand = (sc.text === script.titleProposed && alt) ? trimWords(alt, 10) : script.titleProposed;
      if (cand && cand !== sc.text) { sc.text = cand; changed = true; }
    } else { // punto / cierre (text o number): rota entre trozos cortos no usados
      const pool = allChunks.filter(c => !others.has(c) && c !== sc.text);
      if (pool.length) {
        const nx = pool[sc._rot % pool.length];
        sc.text = nx; const fig = firstFigure(nx);
        if (fig) { sc.layout = "number"; sc.number = fig; } else if (sc.layout === "number") { sc.layout = "text"; delete sc.number; }
        changed = true;
      }
    }
    if (changed) sc.subs = [{ text: sc.text.replace(/^«|»$/g, ""), start: 0, end: sc.durationSec }];
    return changed;
  }

  return { generate, regenerateScene, phrases, extractData, sentences, recommendDuration, chunkSubtitles };
})();

/* === js/tts.js === */
/* =============================================================================
 * MÓDULO TTS — narración por voz, MODULAR (sección 8)
 * -----------------------------------------------------------------------------
 * MVP: usa las voces GRATIS del navegador (Web Speech API) en español latino.
 * Está aislado detrás de una interfaz simple para poder sustituirlo después
 * por ElevenLabs / Google / Azure sin tocar el resto de la app:
 *   NPTTS.speak(text, {rate, onWord, onEnd})  /  NPTTS.stop()  /  NPTTS.listVoices()
 * ===========================================================================*/
window.NPTTS = (function () {
  const CFG = window.NP_CONFIG;
  const synth = window.speechSynthesis || null;
  let voices = [];

  function refreshVoices() { voices = synth ? synth.getVoices() : []; return voices; }
  if (synth) { refreshVoices(); synth.onvoiceschanged = refreshVoices; }

  function pickVoice() {
    if (!voices.length) refreshVoices();
    const langs = [CFG.tts.lang, ...CFG.tts.langFallbacks];
    // 1) voz preferida por nombre
    for (const name of CFG.tts.preferredVoices) {
      const v = voices.find(v => v.name && v.name.toLowerCase().includes(name.toLowerCase()));
      if (v) return v;
    }
    // 2) primera voz que coincida con un idioma español latino
    for (const lg of langs) {
      const v = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(lg.toLowerCase()));
      if (v) return v;
    }
    // 3) cualquier voz en español
    return voices.find(v => (v.lang || "").toLowerCase().startsWith("es")) || voices[0] || null;
  }

  function available() { return !!synth && refreshVoices().some(v => (v.lang || "").toLowerCase().startsWith("es")); }

  function estimateDurationSec(text) {
    const w = (text.match(/\S+/g) || []).length;
    return Math.max(0.6, w / (CFG.duration.wordsPerSec * (CFG.tts.rate || 1)));
  }

  // Habla el texto. onWord(charIndex) permite resaltar/subtitular en vivo.
  function speak(text, opts) {
    opts = opts || {};
    if (!synth) { if (opts.onEnd) opts.onEnd(); return null; }
    stop();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = CFG.tts.lang; }
    u.rate = opts.rate || CFG.tts.rate;
    u.pitch = opts.pitch || CFG.tts.pitch;
    u.onboundary = (e) => { if (opts.onWord) opts.onWord(e.charIndex, e); };
    u.onend = () => { if (opts.onEnd) opts.onEnd(); };
    u.onerror = () => { if (opts.onEnd) opts.onEnd(); };
    synth.speak(u);
    return u;
  }

  function stop() { if (synth) { try { synth.cancel(); } catch (e) {} } }

  function listVoices() {
    return refreshVoices()
      .filter(v => (v.lang || "").toLowerCase().startsWith("es"))
      .map(v => ({ name: v.name, lang: v.lang, default: v.default }));
  }

  /* --- Punto de extensión: implementación de un proveedor externo -------
   * async function synthesizeToAudioBuffer(text) { ...fetch a un TTS de pago... }
   * Devuelve un AudioBuffer que el motor de video incrusta en el MP4.
   * (No implementado en el MVP: se eligió voz gratis del navegador.)         */
  const provider = { name: CFG.tts.provider, synthesizeToAudioBuffer: null };

  return { available, speak, stop, listVoices, pickVoice, estimateDurationSec, refreshVoices, provider };
})();

/* === js/icons.js === */
/* =============================================================================
 * MÓDULO ICONS — vectores editoriales dibujados en canvas (diapositivas destacadas)
 * -----------------------------------------------------------------------------
 * Cuando una idea NO tiene número, se muestra con un ÍCONO que la representa
 * (ubicación, dinero, personas, alerta, ambiente, movilidad…). Se eligen por
 * palabras clave de la frase y se dibujan como líneas limpias animadas.
 * ===========================================================================*/
window.NPIcons = (function () {
  const strip = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  // Grupos palabra-clave → ícono (orden = prioridad).
  const GROUPS = [
    ["money",       /\b(pesos?|millon|mil millones|\$|dinero|presupuesto|inversion|invertir|costo|costar|tarifa|salario|impuesto|renta|recursos|plata|subsidio|multa)\b/],
    ["time",        /\b(plazo|fecha|dias?|semanas?|meses?|anos?|hora|horario|lunes|martes|miercoles|jueves|viernes|sabado|domingo|hoy|manana|ayer|calendario)\b/],
    ["water",       /\b(agua|lluvia|inundaci|acueducto|alcantarill|quebrada|rio\b|potable)\b/],
    ["environment", /\b(ambiental|arbol|arboles|contaminaci|basura|residuo|reciclaj|ecolog|clima|naturaleza|verde|zona verde|humedal|fauna)\b/],
    ["transport",   /\b(mio\b|transporte|via\b|vias\b|trafico|movilidad|conductor|conductores|bus|buses|ruta|rutas|cierre vial|calle|carrera|avenida|transito|carro|vehiculo)\b/],
    ["build",       /\b(obra|obras|construcci|proyecto|edificio|remodel|mantenimiento|infraestructura|parque\b|puente|via en obra)\b/],
    ["law",         /\b(decreto|ley|leyes|resoluci|contrato|norma|articulo|sentencia|acuerdo|reglament|fallo|demanda|juzgado)\b/],
    ["health",      /\b(salud|hospital|medic|enferm|vacuna|clinica|epidemi|pandemia|eps\b|contagio)\b/],
    ["education",   /\b(colegio|estudiante|educaci|escuela|universidad|docente|profesor|clases|matricula)\b/],
    ["warning",     /\b(denuncia|denuncian|alerta|riesgo|peligro|emergencia|protesta|crisis|robo|hurto|violencia|amenaza|reclamo|inseguridad|abandono)\b/],
    ["gov",         /\b(alcald|goberna|concejo|ministeri|secretar|gobierno|poder|eleccion|candidat|voto|senado|congreso|presidente)\b/],
    ["people",      /\b(familias?|personas?|habitantes?|vecinos?|comunidad|ciudadan|lideres?|poblaci|gente|barrio|comuna|residentes)\b/],
    ["place",       /\b(sector|zona|ciudad|cali|valle|departamento|municipio|corregimiento|ubicaci|lugar)\b/],
    ["announce",    /\b(anuncia|anuncio|declara|dice|afirma|informa|confirma|advierte|asegura|revela|presenta)\b/],
  ];

  function match(text) {
    const t = strip(text);
    for (const [name, re] of GROUPS) if (re.test(t)) return name;
    return "spark";
  }

  /* ---- dibujo (líneas limpias, centrado en cx,cy, tamaño S) ------------ */
  function draw(g, name, cx, cy, S, col) {
    const h = S / 2;
    g.save();
    g.translate(cx, cy);
    g.strokeStyle = col; g.fillStyle = col;
    g.lineWidth = Math.max(6, S * 0.055); g.lineCap = "round"; g.lineJoin = "round";
    (DRAW[name] || DRAW.spark)(g, h, col, S);
    g.restore();
  }

  const ring = (g, x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke(); };
  const dot  = (g, x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };

  const DRAW = {
    place(g, h) {  // pin de ubicación
      g.beginPath();
      g.arc(0, -h * 0.2, h * 0.55, Math.PI * 0.15, Math.PI * 0.85, true);
      g.lineTo(0, h * 0.75); g.closePath(); g.stroke();
      dot(g, 0, -h * 0.2, h * 0.18);
    },
    money(g, h, col, S) {  // moneda con $
      ring(g, 0, 0, h * 0.62);
      g.font = `900 ${S * 0.72}px Merriweather, Georgia, serif`;
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText("$", 0, S * 0.03);
    },
    time(g, h) {  // reloj
      ring(g, 0, 0, h * 0.62);
      g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -h * 0.35); g.stroke();
      g.beginPath(); g.moveTo(0, 0); g.lineTo(h * 0.28, h * 0.1); g.stroke();
    },
    water(g, h) {  // gota
      g.beginPath();
      g.moveTo(0, -h * 0.72);
      g.bezierCurveTo(h * 0.7, -h * 0.05, h * 0.5, h * 0.7, 0, h * 0.7);
      g.bezierCurveTo(-h * 0.5, h * 0.7, -h * 0.7, -h * 0.05, 0, -h * 0.72);
      g.stroke();
    },
    environment(g, h) {  // hoja
      g.beginPath();
      g.moveTo(-h * 0.55, h * 0.55);
      g.quadraticCurveTo(-h * 0.7, -h * 0.7, h * 0.6, -h * 0.55);
      g.quadraticCurveTo(h * 0.15, h * 0.15, -h * 0.55, h * 0.55);
      g.stroke();
      g.beginPath(); g.moveTo(-h * 0.42, h * 0.42); g.lineTo(h * 0.38, -h * 0.38); g.stroke();
    },
    transport(g, h) {  // carro
      g.beginPath();
      g.moveTo(-h * 0.75, h * 0.15); g.lineTo(-h * 0.5, -h * 0.2);
      g.lineTo(h * 0.5, -h * 0.2); g.lineTo(h * 0.75, h * 0.15);
      g.lineTo(h * 0.75, h * 0.4); g.lineTo(-h * 0.75, h * 0.4); g.closePath(); g.stroke();
      g.beginPath(); g.moveTo(-h * 0.35, -h * 0.2); g.lineTo(-h * 0.25, -h * 0.5);
      g.lineTo(h * 0.25, -h * 0.5); g.lineTo(h * 0.35, -h * 0.2); g.stroke();
      dot(g, -h * 0.42, h * 0.42, h * 0.13); dot(g, h * 0.42, h * 0.42, h * 0.13);
    },
    build(g, h) {  // grúa / obra
      g.beginPath(); g.moveTo(-h * 0.4, h * 0.7); g.lineTo(-h * 0.4, -h * 0.6);
      g.lineTo(h * 0.6, -h * 0.6); g.stroke();
      g.beginPath(); g.moveTo(-h * 0.4, -h * 0.35); g.lineTo(-h * 0.05, -h * 0.6); g.stroke();

    law(g, h) {  // documento

      g.lineTo(h * 0.5, -h * 0.4); g.lineTo(h * 0.5, h * 0.65);
      g.lineTo(-h * 0.45, h * 0.65); g.closePath(); g.stroke();
      g.beginPath(); g.moveTo(h * 0.25, -h * 0.65); g.lineTo(h * 0.25, -h * 0.4); g.lineTo(h * 0.5, -h * 0.4); g.stroke();
      for (let i = 0; i < 3; i++) { const y = h * (0.0 + i * 0.22); g.beginPath(); g.moveTo(-h * 0.28, y); g.lineTo(h * 0.32, y); g.stroke(); }
    },
    health(g, h) {  // cruz en círculo
      ring(g, 0, 0, h * 0.62);
      g.beginPath(); g.moveTo(0, -h * 0.32); g.lineTo(0, h * 0.32); g.stroke();
      g.beginPath(); g.moveTo(-h * 0.32, 0); g.lineTo(h * 0.32, 0); g.stroke();
    },
    education(g, h) {  // birrete
      g.beginPath(); g.moveTo(0, -h * 0.45); g.lineTo(h * 0.75, -h * 0.1);
      g.lineTo(0, h * 0.25); g.lineTo(-h * 0.75, -h * 0.1); g.closePath(); g.stroke();
      g.beginPath(); g.moveTo(-h * 0.4, -h * 0.02); g.lineTo(-h * 0.4, h * 0.4);
      g.quadraticCurveTo(0, h * 0.62, h * 0.4, h * 0.4); g.lineTo(h * 0.4, -h * 0.02); g.stroke();
    },
    warning(g, h) {  // triángulo de alerta
      g.beginPath(); g.moveTo(0, -h * 0.62); g.lineTo(h * 0.68, h * 0.52);
      g.lineTo(-h * 0.68, h * 0.52); g.closePath(); g.stroke();
      g.beginPath(); g.moveTo(0, -h * 0.15); g.lineTo(0, h * 0.2); g.stroke();
      dot(g, 0, h * 0.38, h * 0.07);

    gov(g, h) {  // edificio con columnas
      g.beginPath(); g.moveTo(-h * 0.7, -h * 0.15); g.lineTo(0, -h * 0.55);
      g.lineTo(h * 0.7, -h * 0.15); g.closePath(); g.stroke();
      for (const x of [-0.45, -0.15, 0.15, 0.45]) { g.beginPath(); g.moveTo(h * x, -h * 0.1); g.lineTo(h * x, h * 0.45); g.stroke(); }
      g.beginPath(); g.moveTo(-h * 0.7, h * 0.55); g.lineTo(h * 0.7, h * 0.55); g.stroke();
    },
    people(g, h) {  // dos personas
      const person = (ox, sc) => {
        g.save(); g.translate(ox, 0); g.scale(sc, sc);
        ring(g, 0, -h * 0.32, h * 0.22);
        g.beginPath(); g.moveTo(-h * 0.34, h * 0.5);
        g.quadraticCurveTo(-h * 0.34, -h * 0.02, 0, -h * 0.02);
        g.quadraticCurveTo(h * 0.34, -h * 0.02, h * 0.34, h * 0.5); g.stroke();

      person(-h * 0.34, 0.86); person(h * 0.38, 0.72);
    },
    announce(g, h) {  // megáfono
      g.beginPath(); g.moveTo(-h * 0.6, -h * 0.22); g.lineTo(h * 0.2, -h * 0.5);
      g.lineTo(h * 0.2, h * 0.3); g.lineTo(-h * 0.6, h * 0.02); g.closePath(); g.stroke();
      g.beginPath(); g.moveTo(-h * 0.6, -h * 0.1); g.lineTo(-h * 0.6, h * 0.35); g.stroke();
      g.beginPath(); g.arc(h * 0.35, -h * 0.1, h * 0.18, -Math.PI / 2, Math.PI / 2); g.stroke();
      g.beginPath(); g.arc(h * 0.35, -h * 0.1, h * 0.4, -Math.PI / 2.4, Math.PI / 2.4); g.stroke();
    },
    spark(g, h) {  // destello (por defecto)
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2;
        g.beginPath(); g.moveTo(Math.cos(a) * h * 0.2, Math.sin(a) * h * 0.2);
        g.lineTo(Math.cos(a) * h * 0.72, Math.sin(a) * h * 0.72); g.stroke();
      }
      dot(g, 0, 0, h * 0.16);
      ring(g, 0, 0, h * 0.4);
    },
  };

  return { match, draw };
})();

  <script>
/* === js/video.js === */
/* =============================================================================
 * MÓDULO VIDEO — composición y renderizado (secciones 11-14)
 * -----------------------------------------------------------------------------
 * Dibuja el guion en un canvas 1080x1920 con animaciones editoriales y exporta
 * un MP4 real (H.264 + AAC) con MediaRecorder. Un solo motor de dibujo (rAF),
 * primer frame "primado" y grabadora + reloj arrancando juntos (aprendizajes
 * de exports previos: evita el desfase de A/V y la pérdida de frames).
 * ===========================================================================*/
window.NPVideo = (function () {
  const CFG = window.NP_CONFIG;
  const B = CFG.brand;
  const W = CFG.video.width, H = CFG.video.height;

  let canvas, ctx, script, imgCache = {}, logoDark = null, logoLight = null, logoRound = null;
  let rafId = null, playing = false, taintedAny = false;
  let audioFile = null, previewAudio = null;   // audio original a incrustar en el MP4 (Caso 3)

  // Define/limpia el audio que se incrustará en el MP4 (archivo subido por la periodista).
  function setAudioFile(file) { audioFile = file || null; }
  function hasAudio() { return !!audioFile; }

  /* ---- carga de recursos --------------------------------------------- */
  // ¿el canvas queda "tintado" tras dibujar esta imagen? (rompería el export)
  function isTainted(img) {
    try { const c = document.createElement("canvas"); c.width = c.height = 6; const x = c.getContext("2d");
      x.drawImage(img, 0, 0, 6, 6); x.getImageData(0, 0, 1, 1); return false; } catch (e) { return true; }
  }
  function tryLoad(url) {
    return new Promise(res => {
      const im = new Image(); im.crossOrigin = "anonymous";
      const to = setTimeout(() => res(null), 12000);
      im.onload = () => { clearTimeout(to); res(isTainted(im) ? null : im); };
      im.onerror = () => { clearTimeout(to); res(null); };
      im.src = url;
    });
  }
  // Las fotos remotas de nuestroparche.com NO envían CORS y tintan el canvas.
  // Se cargan vía images.weserv.nl (proxy de imágenes con CORS) para poder
  // incrustarlas en el MP4. data:/blob: (logos, fotos subidas) van directas.
  async function loadImg(src) {
    if (!src) return null;
    if (/^(data:|blob:)/.test(src)) return await tryLoad(src);
    const noScheme = src.replace(/^https?:\/\//, "");
    let img = await tryLoad("https://images.weserv.nl/?url=" + encodeURIComponent(noScheme) + "&w=1280&output=jpg&q=82");
    if (!img) img = await tryLoad("https://api.allorigins.win/raw?url=" + encodeURIComponent(src)); // respaldo
    if (!img) { taintedAny = true; return null; }   // se omite la foto; se usa fondo de marca
    return img;
  }

  async function ensureFonts() {
    if (!document.fonts) return;
    try {
      await Promise.all([
        document.fonts.load("900 120px 'Merriweather'"),
        document.fonts.load("800 60px 'Inter'"),
        document.fonts.load("600 46px 'Inter'"),
        document.fonts.ready,
      ]);
    } catch (e) {}
  }

  async function prepare(scriptObj, canvasEl) {
    script = scriptObj; canvas = canvasEl;
    canvas.width = W; canvas.height = H;
    ctx = canvas.getContext("2d", { alpha: false });
    await ensureFonts();
    [logoDark, logoLight, logoRound] = await Promise.all([
      loadImg(B.logos.dark), loadImg(B.logos.light), loadImg(B.logos.round),
    ]);
    // precargar imágenes de escenas (noticia + overrides por escena)
    const urls = new Set();
    (script.article.images || []).forEach(im => im && im.url && urls.add(im.url));
    (script.scenes || []).forEach(sc => { if (sc.mediaUrl) urls.add(sc.mediaUrl); });
    await Promise.all([...urls].map(async u => { if (!(u in imgCache)) imgCache[u] = await loadImg(u); }));
    return true;
  }

  // Carga (y cachea) una imagen suelta, p.ej. al "cambiar imagen" de una escena.
  async function addImage(url) { if (!(url in imgCache)) imgCache[url] = await loadImg(url); return imgCache[url]; }

  function imageForScene(sc) {
    // prioridad: imagen elegida por el usuario para ESTA escena > imagen de la noticia (sección 10)
    if (sc.mediaUrl && imgCache[sc.mediaUrl]) return imgCache[sc.mediaUrl];
    const arr = script.article.images || [];
    if (!arr.length || sc.image == null) return null;
    const it = arr[sc.image % arr.length];
    return it ? imgCache[it.url] : null;
  }

  /* ---- utilidades de dibujo ------------------------------------------ */
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const clamp01 = t => Math.max(0, Math.min(1, t));

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function wrap(text, font, maxW) {
    ctx.font = font;
    const words = (text || "").split(/\s+/).filter(Boolean);
    const lines = []; let cur = "";
    for (const w of words) {
      const test = cur ? cur + " " + w : w;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // Ajusta el tamaño de fuente para que el texto quepa en maxLines.
  function fitFont(text, weight, family, maxW, maxLines, start, min) {
    let size = start;
    while (size > min) {
      const lines = wrap(text, `${weight} ${size}px ${family}`, maxW);
      if (lines.length <= maxLines) return { size, lines };
      size -= 4;
    }
    return { size: min, lines: wrap(text, `${weight} ${min}px ${family}`, maxW) };
  }

  function coverDraw(img, x, y, w, h, scale, panx, pany) {
    const ir = img.width / img.height, tr = w / h;
    let dw, dh;
    if (ir > tr) { dh = h * scale; dw = dh * ir; } else { dw = w * scale; dh = dw / ir; }
    const dx = x + (w - dw) / 2 + panx, dy = y + (h - dh) / 2 + pany;
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  function gradient(y0, y1, c0, c1) {
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, c0); g.addColorStop(1, c1); return g;
  }

  function drawKicker(txt, accent, cx, y) {
    ctx.font = "800 34px 'Inter'";
    const tw = ctx.measureText(txt.toUpperCase()).width;
    const pad = 26, w = tw + pad * 2, h = 62, x = cx - w / 2;
    ctx.fillStyle = accent; rr(x, y, w, h, 12); ctx.fill();
    ctx.fillStyle = "#12193A"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(txt.toUpperCase(), cx, y + h / 2 + 2);
  }

  function drawLogo(dark) {
    const logo = dark ? logoDark : logoLight;
    if (!logo) return;
    const lw = 150, lh = logo.height / logo.width * lw;
    ctx.globalAlpha = 0.92;
    ctx.drawImage(logo, W - lw - 54, CFG.video.safe.top - lh - 6 < 40 ? 40 : 48, lw, lh);
    ctx.globalAlpha = 1;
  }

  function drawProgress(p) {
    ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fillRect(0, 0, W, 10);
    ctx.fillStyle = B.gold; ctx.fillRect(0, 0, W * clamp01(p), 10);
  }

  /* ---- escenas -------------------------------------------------------- */
  function drawScene(sc, p, accent) {
    const reveal = easeOut(clamp01(p / 0.28));            // entrada de textos
    const img = imageForScene(sc);
    // fondo
    ctx.fillStyle = B.navyDeep; ctx.fillRect(0, 0, W, H);

    if (sc.layout === "hook") return layoutHook(sc, p, accent, img, reveal);
    if (sc.layout === "icon") return layoutIcon(sc, p, accent, img, reveal);
    if (sc.layout === "number") return layoutNumber(sc, p, accent, img, reveal);
    if (sc.layout === "quote") return layoutQuote(sc, p, accent, img, reveal);
    if (sc.layout === "outro") return layoutOutro(sc, p, accent, reveal);
    // Texto: con foto => foto arriba + texto; SIN foto => texto centrado y grande.
    return img ? layoutText(sc, p, accent, img, reveal) : layoutTextCentered(sc, p, accent, reveal);
  }

  // Diapositiva de SOLO TEXTO (sin foto): letra grande, centrada, tipo texto animado.
  function layoutTextCentered(sc, p, accent, reveal) {
    ctx.fillStyle = gradient(0, H, B.navy, B.navyDeep); ctx.fillRect(0, 0, W, H);
    // acento diagonal sutil abajo
    ctx.save(); ctx.globalAlpha = 0.10; ctx.fillStyle = accent;
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(W, H - 300); ctx.lineTo(W, H); ctx.closePath(); ctx.fill(); ctx.restore();
    drawProgress(sc._gp); drawLogo(true);
    drawKicker(sc.kicker, accent, W / 2, 300);
    const maxW = W - 130;
    const { size, lines } = fitFont(sc.text, 900, B.fontTitle, maxW, 6, 104, 52);
    const lh = size * 1.2;
    let y = H / 2 - (lines.length * lh) / 2;
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    // barra de acento centrada arriba del texto
    ctx.fillStyle = accent; ctx.fillRect(W / 2 - 60 * reveal, y - 46, 120 * reveal, 12);
    lines.forEach((ln, i) => {
      const a = easeOut(clamp01((p - 0.05 - i * 0.06) / 0.32));
      ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 24);
      ctx.font = `900 ${size}px ${B.fontTitle}`; ctx.fillStyle = "#fff";
      ctx.fillText(ln, W / 2, y + i * lh);
      ctx.restore();
    });
  }

  function kenBurns(p) {
    const z = 1 + CFG.motion.kenBurnsZoom * easeOut(clamp01(p));
    const pan = 40 * (easeOut(clamp01(p)) - 0.5);
    return { z, pan };
  }

  function layoutHook(sc, p, accent, img, reveal) {
    const kb = kenBurns(p);
    if (img) { coverDraw(img, 0, 0, W, H, kb.z, kb.pan, -kb.pan * 0.4); }
    else { ctx.fillStyle = gradient(0, H, B.navy, B.navyDeep); ctx.fillRect(0, 0, W, H); }
    // velo para legibilidad
    ctx.fillStyle = gradient(H * 0.35, H, "rgba(19,25,58,0)", "rgba(19,25,58,0.92)"); ctx.fillRect(0, 0, W, H);
    drawProgress(sc._gp); drawLogo(true);
    drawKicker(sc.kicker, accent, W / 2, 150);
    const maxW = W - CFG.video.safe.left - CFG.video.safe.right;
    const { size, lines } = fitFont(sc.text || sc.title, 900, B.fontTitle, maxW, 5, 108, 54);
    let y = H - CFG.video.safe.bottom - lines.length * size * 1.14;
    lines.forEach((ln, i) => {
      const lp = clamp01((p - i * 0.06) / 0.3), a = easeOut(lp);
      ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 26);
      ctx.font = `900 ${size}px ${B.fontTitle}`; ctx.fillStyle = "#fff";
      ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
      ctx.fillText(ln, CFG.video.safe.left, y + i * size * 1.14 + size);
      ctx.restore();
    });
    // barra de acento
    ctx.fillStyle = accent; ctx.fillRect(CFG.video.safe.left, y - 34, 120 * reveal, 12);
  }

  function layoutText(sc, p, accent, img, reveal) {
    const topH = Math.round(H * 0.52);
    if (img) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, topH); ctx.clip();
      const kb = kenBurns(p); coverDraw(img, 0, 0, W, topH, kb.z, kb.pan, 0); ctx.restore(); }
    else { ctx.fillStyle = gradient(0, topH, B.navy, B.navyDeep); ctx.fillRect(0, 0, W, topH); }
    // panel inferior navy
    ctx.fillStyle = B.navy; ctx.fillRect(0, topH, W, H - topH);
    ctx.fillStyle = gradient(topH - 120, topH + 10, "rgba(39,58,112,0)", B.navy); ctx.fillRect(0, topH - 120, W, 130);
    drawProgress(sc._gp); drawLogo(true);
    drawKicker(sc.kicker, accent, W / 2, topH + 46);
    const maxW = W - CFG.video.safe.left - CFG.video.safe.right;
    const { size, lines } = fitFont(sc.text, 700, B.fontBody, maxW, 6, 62, 40);
    let y = topH + 170;
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    lines.forEach((ln, i) => {
      const lp = clamp01((p - 0.05 - i * 0.05) / 0.3), a = easeOut(lp);
      ctx.save(); ctx.globalAlpha = a; ctx.translate((1 - a) * -18, 0);
      ctx.font = `700 ${size}px ${B.fontBody}`; ctx.fillStyle = "#fff";
      ctx.fillText(ln, CFG.video.safe.left, y + i * size * 1.32 + size);
      ctx.restore();
    });
  }

  // Diapositiva DESTACADA con ÍCONO/vector (cuando la idea no tiene número).
  function layoutIcon(sc, p, accent, img, reveal) {
    ctx.fillStyle = gradient(0, H, B.navy, B.navyDeep); ctx.fillRect(0, 0, W, H);
    if (img) { ctx.globalAlpha = 0.12; const kb = kenBurns(p); coverDraw(img, 0, 0, W, H, kb.z, kb.pan, 0); ctx.globalAlpha = 1; }
    ctx.save(); ctx.globalAlpha = 0.10; ctx.fillStyle = accent;
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(W, H - 300); ctx.lineTo(W, H); ctx.closePath(); ctx.fill(); ctx.restore();
    drawProgress(sc._gp); drawLogo(true);
    drawKicker(sc.kicker, accent, W / 2, 250);
    // ícono grande, centrado, con entrada (escala) y leve flote
    const a = easeOut(clamp01(p / 0.34)), scale = 0.72 + 0.28 * a, bob = Math.sin(p * Math.PI * 2) * 8;
    const iconCY = Math.round(H * 0.40);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, iconCY + bob); ctx.scale(scale, scale);
    if (window.NPIcons) NPIcons.draw(ctx, sc.icon || "spark", 0, 0, 320, accent);
    ctx.restore();
    // texto debajo, centrado
    const maxW = W - 150;
    const { size, lines } = fitFont(sc.text, 800, B.fontTitle, maxW, 4, 78, 46);
    const y = iconCY + 230;
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    lines.forEach((ln, i) => {
      const la = easeOut(clamp01((p - 0.16 - i * 0.06) / 0.3));
      ctx.save(); ctx.globalAlpha = la; ctx.font = `800 ${size}px ${B.fontTitle}`; ctx.fillStyle = "#fff";
      ctx.fillText(ln, W / 2, y + i * size * 1.2); ctx.restore();
    });
  }

  function layoutNumber(sc, p, accent, img, reveal) {
    ctx.fillStyle = gradient(0, H, B.navy, B.navyDeep); ctx.fillRect(0, 0, W, H);
    if (img) { ctx.globalAlpha = 0.16; const kb = kenBurns(p); coverDraw(img, 0, 0, W, H, kb.z + 0.1, kb.pan, 0); ctx.globalAlpha = 1; }
    drawProgress(sc._gp); drawLogo(true);
    drawKicker(sc.kicker, accent, W / 2, 240);
    // número con "count-up" cuando es puramente numérico
    const cu = clamp01(p / (CFG.motion.countUpMs / 1000 / sc.durationSec + 0.35));
    const display = animateNumber(sc.number, easeOut(cu));
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const { size } = fitFont(display, 900, B.fontTitle, W - 120, 2, 260, 110);
    ctx.font = `900 ${size}px ${B.fontTitle}`; ctx.fillStyle = accent;
    ctx.save(); const s = 0.9 + 0.1 * easeOut(clamp01(p / 0.25));
    ctx.translate(W / 2, H / 2 - 40); ctx.scale(s, s);
    ctx.fillText(display, 0, 0); ctx.restore();
    // contexto debajo
    const maxW = W - CFG.video.safe.left - CFG.video.safe.right;
    const { size: ts, lines } = fitFont(sc.text, 600, B.fontBody, maxW, 4, 52, 34);
    let y = H / 2 + 120;
    ctx.fillStyle = "#fff"; ctx.font = `600 ${ts}px ${B.fontBody}`;
    lines.forEach((ln, i) => { ctx.save(); ctx.globalAlpha = easeOut(clamp01((p - 0.2 - i * 0.05) / 0.3)); ctx.fillText(ln, W / 2, y + i * ts * 1.35); ctx.restore(); });
  }

  function animateNumber(str, prog) {
    // anima solo la parte numérica; conserva símbolos ($, %, texto) intactos.
    return String(str).replace(/[\d.,]+/, (numStr) => {
      const isInt = !/[.,]\d/.test(numStr);
      const val = parseFloat(numStr.replace(/\./g, "").replace(",", "."));
      if (isNaN(val)) return numStr;
      const cur = val * prog;
      if (isInt) return Math.round(cur).toLocaleString("es-CO");
      return cur.toLocaleString("es-CO", { maximumFractionDigits: 1 });
    });
  }

  function layoutQuote(sc, p, accent, img, reveal) {
    ctx.fillStyle = gradient(0, H, B.navy, B.navyDeep); ctx.fillRect(0, 0, W, H);
    if (img) { ctx.globalAlpha = 0.14; const kb = kenBurns(p); coverDraw(img, 0, 0, W, H, kb.z, kb.pan, 0); ctx.globalAlpha = 1; }
    drawProgress(sc._gp); drawLogo(true);
    drawKicker(sc.kicker, accent, W / 2, 220);
    ctx.fillStyle = accent; ctx.font = "900 240px 'Merriweather'"; ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.globalAlpha = 0.9 * reveal; ctx.fillText("“", CFG.video.safe.left, 300); ctx.globalAlpha = 1;
    const quote = sc.text.replace(/^«|»$/g, "");
    const maxW = W - CFG.video.safe.left - CFG.video.safe.right;
    const { size, lines } = fitFont(quote, 800, B.fontTitle, maxW, 7, 74, 42);
    let y = 470;
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    lines.forEach((ln, i) => {
      const a = easeOut(clamp01((p - 0.05 - i * 0.05) / 0.32));
      ctx.save(); ctx.globalAlpha = a; ctx.font = `800 ${size}px ${B.fontTitle}`; ctx.fillStyle = "#fff";
      ctx.fillText(ln, CFG.video.safe.left, y + i * size * 1.28 + size); ctx.restore();
    });
    if (sc.attribution) {
      ctx.font = "700 40px 'Inter'"; ctx.fillStyle = accent;
      ctx.globalAlpha = easeOut(clamp01((p - 0.4) / 0.3));
      ctx.fillText("— " + sc.attribution, CFG.video.safe.left, y + lines.length * size * 1.28 + 90);
      ctx.globalAlpha = 1;
    }
  }

  function layoutOutro(sc, p, accent, reveal) {
    ctx.fillStyle = gradient(0, H, B.navy, B.navyDeep); ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = accent; ctx.globalAlpha = 0.14;
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(W, H - 380); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    if (logoDark || logoLight) {
      const logo = logoDark || logoLight; const lw = 380, lh = logo.height / logo.width * lw;
      const a = easeOut(clamp01(p / 0.35)); ctx.globalAlpha = a;
      ctx.save(); ctx.translate(W / 2, H / 2 - 180); ctx.scale(0.9 + 0.1 * a, 0.9 + 0.1 * a);
      ctx.drawImage(logo, -lw / 2, -lh / 2, lw, lh); ctx.restore(); ctx.globalAlpha = 1;
    }
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const { size, lines } = fitFont(sc.text, 800, B.fontTitle, W - 160, 3, 66, 44);
    ctx.font = `800 ${size}px ${B.fontTitle}`; ctx.fillStyle = "#fff";
    ctx.globalAlpha = easeOut(clamp01((p - 0.2) / 0.4));
    lines.forEach((ln, i) => ctx.fillText(ln, W / 2, H / 2 + 200 + i * size * 1.2));
    ctx.globalAlpha = 1;
    ctx.font = "800 40px 'Inter'"; ctx.fillStyle = accent;
    ctx.fillText("nuestroparche.com", W / 2, H - CFG.video.safe.bottom + 40);
  }

  /* ---- línea de tiempo ------------------------------------------------ */
  function timeline() {
    let t = 0; const marks = [];
    script.scenes.forEach(sc => { marks.push({ sc, start: t, end: t + sc.durationSec }); t += sc.durationSec; });
    return { marks, total: t };
  }

  function renderAt(tGlobal, tl) {
    const accent = script.section.accent || B.gold;
    const total = tl.total;
    let idx = tl.marks.findIndex(m => tGlobal >= m.start && tGlobal < m.end);
    if (idx < 0) idx = tl.marks.length - 1;
    const m = tl.marks[idx];
    const local = clamp01((tGlobal - m.start) / (m.end - m.start));
    m.sc._gp = tGlobal / total;
    drawScene(m.sc, local, accent);
    // transición suave (crossfade con la siguiente)
    const trans = CFG.motion.transitionMs / 1000;
    if (idx < tl.marks.length - 1 && (m.end - tGlobal) < trans) {
      const a = 1 - (m.end - tGlobal) / trans;
      ctx.save(); ctx.globalAlpha = easeOut(a);
      const nx = tl.marks[idx + 1]; nx.sc._gp = tGlobal / total;
      drawScene(nx.sc, 0, accent); ctx.restore();
    }
    return { idx, local };
  }

  /* ---- reproducción (previsualización) ------------------------------- */
  function play(opts) {
    opts = opts || {};
    stop();
    const tl = timeline();
    const t0 = performance.now();
    playing = true;
    // Audio original (Caso 3): suena en la previsualización.
    if (audioFile) {
      try { if (previewAudio) previewAudio.pause(); previewAudio = new Audio(URL.createObjectURL(audioFile)); previewAudio.currentTime = 0; previewAudio.play().catch(() => {}); } catch (e) {}
    } else if (opts.voice === "con-voz" && window.NPTTS && NPTTS.available()) {
      // narración por voz (modo con voz) — suena en la previsualización
      NPTTS.speak(script.narration, { rate: CFG.tts.rate });
    }
    const loop = () => {
      if (!playing) return;
      const t = (performance.now() - t0) / 1000;
      if (t >= tl.total) { renderAt(tl.total - 0.001, tl); playing = false; if (opts.onEnd) opts.onEnd(); if (window.NPTTS) NPTTS.stop(); return; }
      renderAt(t, tl);
      if (opts.onTime) opts.onTime(t, tl.total);
      rafId = requestAnimationFrame(loop);
    };
    renderAt(0, tl);           // primer frame
    rafId = requestAnimationFrame(loop);
  }

  function stop() { playing = false; if (rafId) cancelAnimationFrame(rafId); if (window.NPTTS) NPTTS.stop(); if (previewAudio) { try { previewAudio.pause(); } catch (e) {} } }

  function seek(tGlobal) { const tl = timeline(); renderAt(Math.max(0, Math.min(tl.total - 0.001, tGlobal)), tl); }

  /* ---- grabación a MP4 (sección 14) ---------------------------------- */
  function pickMime() {
    const list = [CFG.video.mime, ...CFG.video.mimeFallbacks];
    for (const m of list) { if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }
    return "";
  }

  async function record(opts) {
    opts = opts || {};
    stop();
    const tl = timeline();
    const mime = pickMime();
    const stream = canvas.captureStream(CFG.video.fps);

    // --- Incrustar el audio ORIGINAL en el MP4 (Caso 3: entrevistas) ------
    let audioCtx = null, aEl = null, aUrl = null, embeddedAudio = false;
    if (audioFile) {
      try {
        aUrl = URL.createObjectURL(audioFile);
        aEl = new Audio(); aEl.src = aUrl; aEl.preload = "auto";
        await new Promise(r => { aEl.onloadedmetadata = r; aEl.onerror = r; setTimeout(r, 4000); });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        try { await audioCtx.resume(); } catch (e) {}
        const srcNode = audioCtx.createMediaElementSource(aEl);
        const dest = audioCtx.createMediaStreamDestination();
        srcNode.connect(dest);
        srcNode.connect(audioCtx.destination);   // también se escucha mientras graba
        dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
        embeddedAudio = true;
      } catch (e) { embeddedAudio = false; }
    }

    const rec = new MediaRecorder(stream, { mimeType: mime || undefined, videoBitsPerSecond: CFG.video.bitrate });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const cleanupAudio = () => { try { if (aEl) aEl.pause(); } catch (e) {} try { if (audioCtx) audioCtx.close(); } catch (e) {} if (aUrl) URL.revokeObjectURL(aUrl); };

    return await new Promise((resolve, reject) => {
      const t0 = performance.now();
      let done = false;
      rec.onstop = () => {
        cleanupAudio();
        const type = (mime && mime.indexOf("mp4") >= 0) ? "video/mp4" : (chunks[0] ? chunks[0].type : "video/mp4");
        resolve({ blob: new Blob(chunks, { type }), mime: type, tainted: taintedAny, audio: embeddedAudio });
      };
      rec.onerror = e => { cleanupAudio(); reject(e.error || new Error("Error de grabación")); };
      renderAt(0, tl);                       // primer frame "primado"
      rec.start(200);
      if (aEl && embeddedAudio) { try { aEl.currentTime = 0; aEl.play(); } catch (e) {} }
      const loop = () => {
        const t = (performance.now() - t0) / 1000;
        if (t >= tl.total) {
          if (done) return; done = true;
          renderAt(tl.total - 0.001, tl);
          setTimeout(() => { try { rec.stop(); } catch (e) {} stream.getTracks().forEach(t => t.stop()); }, 120);
          return;
        }
        renderAt(t, tl);
        if (opts.onProgress) opts.onProgress(t / tl.total, t, tl.total);
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    });
  }

  function totalDuration() { return timeline().total; }
  function supportedMime() { return pickMime(); }

  return { prepare, addImage, setAudioFile, hasAudio, play, stop, seek, record, renderAt, timeline, totalDuration, supportedMime };
})();

/* === js/transcribe.js === */
/* =============================================================================
 * MÓDULO TRANSCRIBE — transcripción automática de audio (OPCIONAL / beta)
 * -----------------------------------------------------------------------------
 * Usa Whisper open-source corriendo EN EL NAVEGADOR vía transformers.js
 * (@xenova/transformers, gratis). Se carga SOLO cuando la periodista lo pide.
 * Si no está disponible (sin conexión, o abriendo el archivo local), la app
 * sigue funcionando con la transcripción MANUAL editable.
 * ===========================================================================*/
window.NPTranscribe = (function () {
  let asr = null, loading = null;
  const MODEL = "Xenova/whisper-base";   // multilingüe; equilibrio tamaño/calidad
  const CDN = "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";

  function isAvailable() {
    // requiere http(s): los módulos ES no cargan desde file://
    return location.protocol.startsWith("http");
  }

  async function ensurePipeline(onStatus) {
    if (asr) return asr;
    if (loading) return loading;
    loading = (async () => {
      onStatus && onStatus("Descargando el modelo de transcripción (una sola vez)…");
      const t = await import(/* @vite-ignore */ CDN);
      t.env.allowLocalModels = false;
      asr = await t.pipeline("automatic-speech-recognition", MODEL, {
        progress_callback: (p) => {
          if (p && p.status === "progress" && p.file && onStatus)
            onStatus(`Descargando modelo: ${p.file} ${Math.round(p.progress || 0)}%`);
        },
      });
      return asr;
    })();
    return loading;
  }

  // Decodifica el archivo de audio a mono 16 kHz (lo que espera Whisper).
  async function decodeTo16k(file) {
    const buf = await file.arrayBuffer();
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC();
    const decoded = await ac.decodeAudioData(buf.slice(0));
    const off = new OfflineAudioContext(1, Math.ceil(decoded.duration * 16000), 16000);
    const src = off.createBufferSource();
    // mezcla a mono
    const mono = off.createBuffer(1, decoded.length, decoded.sampleRate);
    const tmp = mono.getChannelData(0);
    for (let ch = 0; ch < decoded.numberOfChannels; ch++) {
      const d = decoded.getChannelData(ch);
      for (let i = 0; i < d.length; i++) tmp[i] += d[i] / decoded.numberOfChannels;
    }
    src.buffer = mono; src.connect(off.destination); src.start();
    const rendered = await off.startRendering();
    ac.close && ac.close();
    return rendered.getChannelData(0);
  }

  async function transcribe(file, onStatus) {
    if (!isAvailable())
      throw new Error("La transcripción automática necesita la app publicada (http/https). Por ahora escribe o pega la transcripción manualmente.");
    const pipe = await ensurePipeline(onStatus);
    onStatus && onStatus("Procesando el audio…");
    const audio = await decodeTo16k(file);
    onStatus && onStatus("Transcribiendo (español)…");
    const out = await pipe(audio, { chunk_length_s: 30, stride_length_s: 5, language: "spanish", task: "transcribe" });
    return (out && out.text ? out.text : "").trim();
  }

  return { isAvailable, transcribe };
})();

  function fileToImageUrl(file) {
    return new Promise(res => {
      if (!file) return res(null);
      if (file.type.startsWith("image/")) return res(URL.createObjectURL(file));
      if (file.type.startsWith("video/")) {

        v.onloadeddata = () => { try { v.currentTime = Math.min(0.6, (v.duration || 1) / 3); } catch (e) { grab(); } };
