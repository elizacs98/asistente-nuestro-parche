        <div class="row" id="dur-row">
          ${(CFG.duration.options || [30, 40, 50, 60]).map(d => `<button class="btn ${d === sc.recommendedSec ? "gold" : "ghost"} sm dur-btn" data-d="${d}">${d}s</button>`).join("")}
        </div>
        <div class="hint">Cambiar la duración vuelve a armar el guion (más o menos escenas).</div>
      </div>

      <div class="field">
        <label class="lb">Modo de video</label>
        <div class="seg" id="voice-seg">
          <button data-v="sin-voz" class="${S.voice === "sin-voz" ? "on" : ""}">Sin voz</button>
          <button data-v="con-voz" class="${S.voice === "con-voz" ? "on" : ""}">Con voz</button>
        </div>
      </div>

      <h2 class="mt">Guion (${sc.scenes.length} diapositivas · ${sc.durationSec}s)</h2>
      <p class="hint" style="margin-top:-6px">Edita cualquier escena. El texto solo usa información de la fuente.</p>
      ${scenes}

      <div class="card">
        <b>Datos clave detectados</b>
        <div class="tags">${dataTags.length ? dataTags.map(t => `<span class="tag">${esc(t)}</span>`).join("") : '<span class="empty">—</span>'}</div>
      </div>

      <div class="card">
        <b>Imágenes disponibles</b>
        ${thumbs}
        <div class="row mt"><label class="btn ghost sm" style="cursor:pointer">➕ Cargar fotos/videos<input type="file" id="rv-media" accept="image/*,video/*" multiple hidden></label></div>
      </div>

      <div class="row end mt">
        <button class="btn ghost" id="rv-regen">↻ Regenerar guion</button>
        <button class="btn gold" id="rv-approve">Aprobar y crear video ›</button>
      </div>
    `);

    // eventos revisión
    $("rv-title").oninput = e => {
      const v = e.target.value; sc.titleProposed = v; a.title = v;
      // Actualiza las diapositivas de gancho con el nuevo título (en trozos cortos).
      const hp = NPScript.phrases(v); const half = Math.ceil(hp.length / 2);
      const gan = sc.scenes.filter(s => s.role === "gancho");
      if (gan[0]) gan[0].text = hp.slice(0, gan.length > 1 ? half : hp.length).join(" ") || v;
      if (gan[1]) gan[1].text = hp.slice(half).join(" ") || v;
      gan.forEach(s => { s.title = v; s.subs = [{ text: s.text, start: 0, end: s.durationSec }]; });
    };
    $("rv-section").onchange = e => {
      a.sectionSlug = e.target.value; sc.section = CFG.sections[e.target.value];
      sc.scenes.forEach(s => { if (s.role === "gancho") s.kicker = sc.section.kicker; if (s.role === "cierre") s.kicker = sc.section.name; });
      toast("Sección: " + sc.section.name);
    };
    screen().querySelectorAll(".sc-text").forEach(t => t.onchange = e => { const i = +e.target.dataset.i; sc.scenes[i].text = e.target.value; sc.scenes[i].subs = NPScript.chunkSubtitles(e.target.value, sc.scenes[i].durationSec); });
    screen().querySelectorAll(".dur-btn").forEach(b => b.onclick = () => { S.script = NPScript.generate(a, { voice: S.voice, durationSec: +b.dataset.d }); renderReview(); });
    screen().querySelectorAll("#voice-seg button").forEach(b => b.onclick = () => { S.voice = b.dataset.v; sc.voice = S.voice; screen().querySelectorAll("#voice-seg button").forEach(x => x.classList.toggle("on", x.dataset.v === S.voice)); });
    $("rv-media").onchange = async e => {
      const files = [...e.target.files]; if (!files.length) return;
      toast("Procesando recursos…");
      for (const f of files) { const url = await fileToImageUrl(f); if (url) a.images.unshift({ url, caption: "" }); }
      toast(files.length + " recurso(s) agregado(s)."); renderReview();
    };
    $("rv-regen").onclick = () => { S.seed = (S.seed || 0) + 1; S.script = NPScript.generate(a, { voice: S.voice, durationSec: S.script.recommendedSec, seed: S.seed }); renderReview(); toast("Guion regenerado (nueva variante)."); };
    $("rv-approve").onclick = approve;
  }

  /* ---- APROBAR → preparar y mostrar video ---------------------------- */
  async function approve() {
    loading("Preparando el video…");
    S.script.voice = S.voice;
    try {
      // Caso 3: incrustar el audio original y ajustar la duración del video al audio.
      NPVideo.setAudioFile(S.audioFile || null);
      S.audioEmbedded = false;
      if (S.audioFile) {
        const dur = await getAudioDuration(S.audioFile);
        if (dur && dur > 3) {
          const target = Math.min(CFG.duration.maxSec, Math.max(CFG.duration.minSec, dur));
          rescaleDurations(S.script.scenes, target);
          S.audioClipped = dur > CFG.duration.maxSec;
        }
        S.audioEmbedded = true;
      }
      await NPVideo.prepare(S.script, canvas); S.prepared = true; renderVideo();
    } catch (e) { errorScreen("No se pudo preparar el video: " + e.message, renderReview); }
  }

  // Reescala las duraciones de las escenas para que sumen 'target' (p.ej. la del audio).
  function rescaleDurations(scenes, target) {
    const cur = scenes.reduce((a, s) => a + s.durationSec, 0) || 1;
    const f = target / cur;
    scenes.forEach(s => { s.durationSec = Math.round(s.durationSec * f * 10) / 10; s.subs = NPScript.chunkSubtitles(s.text, s.durationSec); });
  }

  /* ---- PANTALLA DE VIDEO (secciones 16-17) --------------------------- */
  function renderVideo() {
    const sc = S.script, a = sc.article;
    back(true, renderReview);
    set(`
      <h2>Video</h2>
      <div class="card">
        <div class="kv"><b>Sección</b><span class="chip" style="background:${sc.section.accent};color:#12193A">${esc(sc.section.name)}</span></div>
        <div class="kv"><b>Duración</b><span>${NPVideo.totalDuration().toFixed(1)}s</span></div>
        <div class="kv"><b>Resolución</b><span>1080 × 1920 · 9:16 · ${CFG.video.fps} fps</span></div>
        <div class="kv"><b>Modo</b><span>${S.audioEmbedded ? "🎙️ Con tu audio original" : (S.voice === "con-voz" ? "Con voz + subtítulos" : "Sin voz (texto animado)")}</span></div>
        <div class="kv"><b>Escenas</b><span>${sc.scenes.length}</span></div>
      </div>
      ${S.audioEmbedded ? `<div class="warn"><b>🎙️</b><div>El <b>audio que subiste quedará dentro del MP4</b>. El video dura lo mismo que el audio${S.audioClipped ? ` (se usa hasta ${CFG.duration.maxSec}s; si tu audio es más largo, recórtalo antes)` : ""}.</div></div>` : ""}

      <div class="stage" id="stage"></div>
      <div class="transport">
        <button class="btn primary" id="play">▶ Reproducir</button>
        <button class="btn ghost" id="stopb">■ Detener</button>
      </div>

      <div class="card" id="gen-card">
        <div class="row" style="justify-content:space-between;align-items:center">
          <b>Generar MP4</b><span class="hint" id="mime-note"></span>
        </div>
        <div class="bar mt" style="display:none" id="progwrap"><i id="prog"></i></div>
        <div class="row mt">
          <button class="btn gold block" id="gen">🎬 Generar video MP4</button>
        </div>
        <div id="dl-area" class="mt"></div>
        ${(S.voice === "con-voz" && !S.audioEmbedded) ? `<div class="warn mt"><b>ℹ️</b><div>El MP4 se genera con imagen y subtítulos. La <b>voz de computadora</b> suena en la previsualización; para incrustarla en el archivo, compón la narración en CapCut (tu flujo actual) o conecta un motor TTS después.</div></div>` : ""}
      </div>

      <h2 class="mt">Escenas (regeneración selectiva)</h2>
      <p class="hint" style="margin-top:-6px">Arregla solo lo que necesites sin rehacer todo el video.</p>
      <div id="scene-list"></div>
    `);
    // montar canvas en el escenario
    const stage = $("stage"); stage.appendChild(canvas); canvas.style.display = "block";
    NPVideo.seek(0);
    $("mime-note").textContent = NPVideo.supportedMime() ? "" : "Tu navegador no soporta MP4 directo; se usará WebM.";

    $("play").onclick = () => NPVideo.play({ voice: S.voice, onTime: () => {}, onEnd: () => {} });
    $("stopb").onclick = () => NPVideo.stop();
    $("gen").onclick = generate;
    renderSceneList();
  }

  function renderSceneList() {
    const sc = S.script;
    const host = $("scene-list");
    host.innerHTML = sc.scenes.map((s, i) => `
      <div class="scene">
        <div class="sh"><div class="n">${i + 1}</div><div class="role">${esc(s.kicker || s.role)}</div><div class="dur">${s.durationSec}s</div></div>
        <textarea class="v-text" data-i="${i}">${esc(s.text)}</textarea>
        <div class="acts">
          <button class="btn ghost sm" data-a="regen" data-i="${i}">↻ Regenerar escena</button>
          <label class="btn ghost sm" style="cursor:pointer">🖼️ Cambiar imagen/video<input type="file" accept="image/*,video/*" hidden data-i="${i}" class="v-img"></label>
          <button class="btn ghost sm" data-a="preview" data-i="${i}">▶ Ver escena</button>
          <button class="btn ghost sm" data-a="del" data-i="${i}" style="color:var(--danger);border-color:var(--danger)">🗑 Eliminar</button>
        </div>
      </div>`).join("");
    host.querySelectorAll(".v-text").forEach(t => t.onchange = e => { const i = +e.target.dataset.i; sc.scenes[i].text = e.target.value; sc.scenes[i].subs = NPScript.chunkSubtitles(e.target.value, sc.scenes[i].durationSec); seekScene(i); });
    host.querySelectorAll("[data-a=regen]").forEach(b => b.onclick = () => {
      const changed = NPScript.regenerateScene(sc, +b.dataset.i);
      renderSceneList(); seekScene(+b.dataset.i);
      toast(changed ? "Escena regenerada." : "No hay otra variante en la fuente para esta escena. Edita el texto a mano.", changed ? 2400 : 3600);
    });
    host.querySelectorAll("[data-a=preview]").forEach(b => b.onclick = () => seekScene(+b.dataset.i));
    host.querySelectorAll("[data-a=del]").forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (sc.scenes.length <= 3) return toast("El video necesita al menos 3 diapositivas.", 3000);
      sc.scenes.splice(i, 1);
      NPVideo.stop();
      renderVideo();   // refresca duración, conteo y lista
      toast("Diapositiva eliminada. Nueva duración: " + NPVideo.totalDuration().toFixed(1) + "s");
    });
    host.querySelectorAll(".v-img").forEach(inp => inp.onchange = async e => {
      const i = +e.target.dataset.i, f = e.target.files[0]; if (!f) return;
      toast("Procesando…");
      const url = await fileToImageUrl(f); if (!url) return toast("No se pudo usar ese archivo.");
      sc.scenes[i].mediaUrl = url;
      await NPVideo.addImage(url); seekScene(i); toast("Imagen cambiada en la escena " + (i + 1));
    });
  }

  function seekScene(i) {
    const marks = NPVideo.timeline().marks;
    if (marks[i]) NPVideo.seek(marks[i].start + 0.35);
  }

  /* ---- GENERAR MP4 (sección 14) + DESCARGA (sección 18) -------------- */
  async function generate() {
    const btn = $("gen"); btn.disabled = true;
    $("progwrap").style.display = "block";
    const prog = $("prog");
    NPVideo.stop();
    try {
      const res = await NPVideo.record({ onProgress: p => prog.style.width = Math.round(p * 100) + "%" });
      S.lastBlob = res.blob;
      const date = (S.article.date || new Date().toISOString().slice(0, 10));
      const ext = res.mime.indexOf("mp4") >= 0 ? "mp4" : "webm";
      const name = `${date}_${slugify(S.article.title)}_nuestro-parche.${ext}`;
      const url = URL.createObjectURL(res.blob);
      $("dl-area").innerHTML = `
        <div class="card" style="border-color:${S.script.section.accent}">
          <b>✅ Video listo</b>
          <div class="kv mt"><b>Archivo</b><span>${esc(name)}</span></div>
          <div class="kv"><b>Tamaño</b><span>${(res.blob.size / 1048576).toFixed(1)} MB · ${ext.toUpperCase()}</span></div>
          <div class="kv"><b>Audio</b><span>${res.audio ? "✅ Incluido (tu audio original)" : "Sin audio"}</span></div>
          ${res.tainted ? '<div class="warn mt"><b>⚠️</b><div>Alguna imagen externa bloqueó el export; si el video sale sin esas fotos, cárgalas manualmente con "Cambiar imagen".</div></div>' : ""}
          <a class="btn gold block mt" id="dl" href="${url}" download="${esc(name)}">⬇️ Descargar MP4</a>
          <div class="hint mt">Revisar → Descargar → Publicar en tus redes. La app no publica automáticamente.</div>
        </div>`;
      prog.style.width = "100%";
      toast("Video generado.");
      // en móvil, algunos navegadores requieren tap explícito en el enlace de descarga
    } catch (e) {
      $("dl-area").innerHTML = `<div class="warn mt"><b>⚠️</b><div>No se pudo generar: ${esc(e.message || e)}</div></div>`;
    } finally { btn.disabled = false; }
  }

  /* ---- init ----------------------------------------------------------- */
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.deferredPrompt = e; const h = $("install-hint"); if (h) h.classList.add("show"); });
  document.addEventListener("DOMContentLoaded", () => {
    const logo = $("brand-logo"); if (logo && CFG.brand.logos.dark) logo.src = CFG.brand.logos.dark;
    renderHome();
  });
})();

</script>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(()=>{}));
    }
  </script>
</body>
</html>
